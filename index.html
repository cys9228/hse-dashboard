<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06122a">
<title>이재성플랫폼 | 본사 통합 안전현황 대시보드</title>
<style>
:root{--bg:#122546;--line:#1f3d70;--tx:#e6eefc;--mut:#8ea6cf;--blue:#2f80ff;--red:#ef4444;--org:#f59e0b;--yel:#facc15;--grn:#22c55e}
*{box-sizing:border-box}
body{margin:0;font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
a{color:inherit}
.top{height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#0d1b38;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.logo{font-weight:800;font-size:21px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo svg{width:30px;height:30px}
.top .sub{color:var(--mut);font-size:12px;white-space:nowrap}
.top .sp{flex:1}
.top .slog{color:#c9d7f0;font-size:13px;white-space:nowrap}
.top .clock{color:#c9d7f0;font-size:13px;white-space:nowrap}
.user{display:flex;align-items:center;gap:6px;border-left:1px solid var(--line);padding-left:12px}
.user select{background:transparent;border:none;color:#fff;font-weight:700;padding:4px}
.hamb{display:none;background:none;border:1px solid var(--line);color:#fff;border-radius:8px;font-size:18px;padding:4px 10px;cursor:pointer}
.wrap{display:flex}
.side{width:212px;flex:none;background:#0f1f3f;border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.side .grp{color:#b8c9e8;font-size:13px;margin:14px 6px 6px;font-weight:700;padding-top:12px;border-top:1px solid var(--line)}
.side a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;color:#c9d7f0;text-decoration:none;cursor:pointer;font-size:14px;margin:1px 0}
.side a:hover{background:#0f2550}
.side a.on{background:#14336f;color:#fff;font-weight:700}
.side a.head{background:var(--blue);color:#fff;font-weight:800;margin-bottom:6px}
.side .ico{width:20px;text-align:center}
main{flex:1;min-width:0;padding:18px}
.phead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.phead h1{margin:0;font-size:24px}
.phead p{margin:4px 0 0;color:var(--mut)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:#0b1d40;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 10px;font:inherit;max-width:100%}
input[type=date]{color-scheme:dark}
textarea{resize:vertical}
.btn{background:#13306a;border:1px solid #2a4f90;color:#dce8ff;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{background:#5b1620;border-color:#a3243a;color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.ghost{background:transparent;border-color:#2f6fe0;color:#cfe0ff}
.panel{background:linear-gradient(180deg,#0e2350,#0b1c41);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.panel h3{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3 small{font-size:12px;color:var(--mut);font-weight:500}
.panel h3 .lnk{font-size:12px;color:#9cc0ff;font-weight:500;cursor:pointer}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}
.dside{display:flex;flex-direction:column;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{display:flex;gap:14px;align-items:center;cursor:pointer}
.kpi:hover{border-color:#3c6cc0}
.kpi .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;flex:none}
.kpi .ic svg{width:28px;height:28px}
.kpi .lb{font-weight:700;font-size:15px}
.kpi .v{font-size:38px;font-weight:800;line-height:1.15}
.kpi .v small{font-size:17px;margin-left:4px}
.kpi .s{color:var(--mut);font-size:12px}
.row2,.row3{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;margin-top:14px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.sitebox .t td,.sitebox .t th{white-space:nowrap}
.sk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sk-now{display:flex;align-items:baseline;gap:6px;margin:2px 0}
.sk-now b{font-size:30px;line-height:1.1;font-weight:800}.sk-now small{font-size:14px;color:var(--mut)}.sk-now span{font-weight:800;font-size:14px}
.sk-leg{display:flex;gap:10px;font-size:11px;color:var(--mut)}.sk-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.sk-svg{width:100%;height:auto;display:block;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:#0a1a3a;border:1px solid var(--line);color:#c9d7f0;border-radius:999px;padding:3px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.chip.on{background:#2f80ff;border-color:#2f80ff;color:#fff;font-weight:700}
.sbh{display:grid;grid-template-columns:92px 1fr 58px 70px;gap:8px;font-size:12px;color:var(--mut);padding:0 4px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sbh span:last-child{text-align:right}
.sbr{display:grid;grid-template-columns:92px 1fr 58px 70px;gap:8px;align-items:center;font-size:13px;padding:5px 4px;cursor:pointer;border-radius:6px}
.sbr:hover{background:#122a5a}
.sbr .sn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.sbr .sn i{width:8px;height:8px;border-radius:50%;flex:none}
.sbr .at{height:14px}
.sbr .sc{font-size:12.5px;white-space:nowrap}
.sbr .at i{white-space:nowrap;padding:0 6px;min-width:34px}
.sbr .at em{font-style:normal;font-size:11px;color:#4ade80;padding-left:6px;display:flex;align-items:center}
.sbr .sv{text-align:right;font-size:12px;white-space:nowrap}
.sitebox{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:start}
.map svg{width:100%;height:auto;display:block}
.map .pin{cursor:pointer}
.legend{display:flex;gap:12px;font-size:13px;color:#c9d7f0;font-weight:500}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{color:var(--mut);font-weight:600;text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:7px 6px;border-bottom:1px solid #16305e;vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:#122a5a}
.t td.num,.t th.num{text-align:right}
.empty{text-align:center;color:var(--mut);padding:24px!important}
.bd{display:inline-block;padding:2px 11px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.bd.r{background:#dc3540}.bd.o{background:none;color:#fbbf24}.bd.g{background:none;color:#4ade80}.bd.b{background:none;color:#7fb0ff}.bd.gr{background:none;color:#94a3b8}
.red{color:#ff6b6b;font-weight:700}.org{color:#ffb547;font-weight:700}.grn{color:#4ade80;font-weight:700}.mut{color:var(--mut)}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.leg{flex:1;min-width:170px}
.leg div{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.leg i{width:11px;height:11px;border-radius:50%;flex:none}
.leg b{margin-left:auto;font-weight:600}
.leg em{color:var(--mut);font-style:normal;width:50px;text-align:right}
.bar{display:grid;grid-template-columns:96px 1fr 46px;gap:8px;align-items:center;font-size:13px;padding:4px 0;cursor:pointer}
.bar .tr{height:14px;background:#0a1a3a;border-radius:3px;overflow:hidden}
.bar .fl{height:100%;border-radius:3px}
.bar .pc{text-align:right}
.alertp{border-color:#b4232f;background:linear-gradient(180deg,#2a0f22,#170f2c)}
.alerts .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #3a2140;cursor:pointer}
.alerts .it:last-child{border-bottom:none}
.alerts .tag{width:48px;height:36px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:#fff}
.alerts .tx{flex:1;min-width:0}
.alerts .tx b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alerts .tx span{font-size:12px;color:var(--mut)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;border:1px solid #2a4f90;background:#0f2a5c;cursor:pointer}
.stat.g{background:#0b3b3a;border-color:#16806a}
.stat.r{background:#3d1424;border-color:#c0303f}.stat.r .si{background:#d03a48!important}
.stat .si{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:#1d4ea8;flex:none}
.stat.g .si{background:#15805e}
.stat .l{font-size:11.5px;color:#c9d7f0;white-space:nowrap}
.stat .n{font-size:21px;white-space:nowrap;font-weight:800}
.stat .n small{font-size:13px;margin-left:3px;font-weight:600}
.notice{list-style:none;margin:0;padding:0}
.notice li{display:flex;gap:8px;padding:7px 0;font-size:13px;border-bottom:1px solid #16305e;cursor:pointer}
.notice li:before{content:'•';color:#5b9bff}
.notice li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice li em{color:var(--mut);font-style:normal}
.slogan{min-height:150px;border:1px solid var(--line);border-radius:12px;padding:20px;background:linear-gradient(160deg,#1b4a9a 0%,#0c2252 55%,#2a1c3c 100%);position:relative;overflow:hidden}
.slogan b{font-size:24px;line-height:1.35;display:block}
.slogan p{color:#bcd0f2;font-size:13px;margin:10px 0 0}
.slogan svg{position:absolute;right:0;bottom:0;opacity:.45}
.prog{height:8px;background:#0a1a3a;border-radius:4px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--blue)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar .sp{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{cursor:pointer}
.card .ttl{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;margin-bottom:10px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mini div{background:#0a1a3a;border-radius:8px;padding:8px 4px}
.mini b{display:block;font-size:20px}
.mini span{font-size:11px;color:var(--mut)}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.sumrow .panel{text-align:center;padding:12px}
.sumrow b{display:block;font-size:26px}
.sumrow span{color:var(--mut);font-size:12px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gal .pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.gal .pair div{aspect-ratio:4/3;background:#0a1a3a;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mut);font-size:12px;position:relative}
.gal .pair img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.gal .pair em{position:absolute;left:4px;top:4px;background:#000a;color:#fff;font-style:normal;font-size:11px;padding:1px 6px;border-radius:4px}
.thumb{width:46px;height:34px;object-fit:cover;border-radius:4px;cursor:pointer;vertical-align:middle}
.modal-bg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:250;padding:12px}
.modal-bg.on{display:flex}
.modal{background:#0d2147;border:1px solid var(--line);border-radius:14px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.modal .mh button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.modal .mb{padding:16px 18px;overflow:auto}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .mf .left{margin-right:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;color:var(--mut);font-weight:600}
.fld.wide{grid-column:1/-1}
.phbox img{max-width:240px;max-height:170px;border-radius:8px;display:block;margin-bottom:6px}
.note{background:#0a1a3a;border:1px dashed #2a4f90;border-radius:10px;padding:12px 14px;color:#c9d7f0;font-size:13px;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rpt-head{display:none}
body.ro .ed{display:none!important}
body.locked .top,body.locked .wrap{display:none!important}
#auth{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;background:radial-gradient(1200px 600px at 20% 0%,#1b4a9a55,transparent),linear-gradient(160deg,#0b1f45,#06122a 60%)}
.au-box{width:min(460px,100%);background:#0e2350;border:1px solid #2a4f90;border-radius:16px;padding:26px 26px 18px;box-shadow:0 20px 60px #0009}
.au-box:has(.form){width:min(560px,100%)}
.au-brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.au-brand b{display:block;font-size:22px}.au-brand span{color:var(--mut);font-size:13px}
.au-box h2{margin:0 0 4px;font-size:19px}.au-box p{margin:0 0 12px}
.au-box .fld input{padding:11px 12px;font-size:15px}
.au-tabs{display:grid;grid-template-columns:1fr 1fr;background:#0a1a3a;border-radius:10px;padding:4px;margin-bottom:14px}
.au-tabs button{background:none;border:none;color:#9fb3d6;font:inherit;font-weight:700;padding:9px;border-radius:8px;cursor:pointer}
.au-tabs button.on{background:#2f80ff;color:#fff}
.au-go{width:100%;margin-top:14px;padding:12px;font-size:15px}
.au-link{display:block;margin:12px auto 0;background:none;border:none;color:#7fb0ff;font:inherit;font-size:13px;cursor:pointer}
.au-msg{background:#3d1424;border:1px solid #dc3540;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;font-weight:600}
.au-msg.ok{background:#0b3b2a;border-color:#22a35a}
.pend{background:#dc3540;color:#fff;border-radius:999px;font-size:11px;padding:0 7px;margin-left:4px}
.t.mem td{white-space:nowrap}.t.mem select,.t.mem input{padding:5px 8px}
.onesite{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#14336f;border:1px solid #2f80ff;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.ckb{display:flex;align-items:center;gap:8px;background:#0b1d40;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.ckb input{width:18px;height:18px;accent-color:#dc3540}
.vtg{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:700;margin-right:3px;border:1px solid}
.vtg.el{color:#c4b5fd;border-color:#6d5bd0}.vtg.bp{color:#fda4af;border-color:#b4234a}.vtg.dm{color:#fcd34d;border-color:#a8740b}.vtg.hr{color:#fff;background:#dc3540;border-color:#dc3540}
.vbanner{background:#3d1424;border:1px solid #dc3540;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-weight:700}
.stk{display:flex;height:22px;border-radius:6px;overflow:hidden;background:#0a1a3a;margin:6px 0 10px}
.stk i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800;color:#fff}
.lamp{display:inline-block;width:12px;height:12px;border-radius:50%;background:#475569}
.lamp.red{background:#dc3540;box-shadow:0 0 8px #dc3540}.lamp.amber{background:#f5b40b}.lamp.green{background:#22c55e}
.vwalert{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #3a2140;cursor:pointer}
.vwalert b{font-size:13px}.vwalert span{font-size:12px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1f3b6e;color:#fff;border:1px solid #3b6fd8;padding:11px 20px;border-radius:10px;font-weight:700;font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 30px #0008}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.achips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.achips div{background:#0a1a3a;border:1px solid;border-radius:10px;text-align:center;padding:8px 4px}
.achips b{display:block;font-size:26px;line-height:1.1}
.achips span{font-size:12px;color:#c9d7f0}
.rrow{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;font-size:13px;padding:5px 4px;cursor:pointer;border-radius:6px}
.rrow:hover{background:#122a5a}
.rrow .rn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rc{font-size:12px;text-align:right;white-space:nowrap}
.rrow .at i{min-width:34px}
.abar{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;font-size:13px;padding:5px 0;cursor:pointer}
.abar:hover{background:#122a5a}
.at{display:flex;height:20px;background:#0a1a3a;border-radius:4px;overflow:hidden}
.at i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800;color:#fff;min-width:18px}
.abar .ac{font-size:12px;text-align:right;white-space:nowrap}
.sync{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;cursor:pointer;font-weight:700}
.sync.ok{color:#4ade80;border-color:#16805a}.sync.err{color:#ff6b6b;border-color:#a3243a}.sync.busy{color:#facc15;border-color:#8a6d0b}.sync.off{color:var(--mut)}
.user b{white-space:nowrap}.user .mut{white-space:nowrap}
@media (max-width:760px){#shareBtn{display:none}.user .mut,.user b{display:none}.user{padding-left:6px}.top{gap:6px;padding:0 8px}.logo{font-size:16px!important}.logo svg{width:24px;height:24px}.sync{font-size:11px;padding:3px 7px}}
@media (max-width:1300px){.dash{grid-template-columns:1fr}.dside{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}}
@media (max-width:1050px){.kpis{grid-template-columns:1fr 1fr}.row2,.row3,.grid2{grid-template-columns:1fr}.top .slog{display:none}}
@media (max-width:760px){
 .side{position:fixed;left:-240px;top:58px;z-index:50;transition:left .2s;box-shadow:4px 0 20px #0008}
 .side.open{left:0}
 .hamb{display:inline-block}
 .top .sub,.top .clock{display:none}
 .logo{font-size:18px}
 main{padding:12px}
 .sitebox{grid-template-columns:1fr}
 .map{max-width:200px;margin:0 auto}
 .kpi{flex-direction:column;align-items:flex-start;gap:6px}
 .kpi .ic{width:42px;height:42px;font-size:20px}
 .kpi .v{font-size:28px}
 .form{grid-template-columns:1fr}
 .phead h1{font-size:20px}
}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff;color:#000}
 .top,.side,.filters,.toolbar,.noprint{display:none!important}
 main{padding:0}
 .panel{background:#fff;border:1px solid #999;color:#000}
 .t th,.t td{color:#000;border-color:#999}
 .bd{color:#000;border:1px solid #666;background:#fff!important}
 .rpt-head{display:block}
 .mut{color:#444}
}
</style>
</head>
<body>

function demo(){
 const T=today();let s=11;const rnd=()=>(s=(s*9301+49297)%233280)/233280;const pick=a=>a[Math.floor(rnd()*a.length)];
 const SL=[['용인 A현장','용인',180,40],['수원 B현장','수원',150,32],['판교 C현장','판교(성남)',130,45],['대전 D현장','대전',110,18],['천안 E현장','천안',90,12],['안성 F현장','안성',85,20],['평택 G현장','평택',160,38],['화성 H현장','화성',120,26],['광주 I현장','광주',95,15],['부산 J현장','부산',140,22],['울산 K현장','울산',100,30],['제주 L현장','제주',70,8]];

 const D={'추락':['개구부 덮개 미설치','안전난간 일부 해체','작업발판 고정 불량','철근 작업 중 추락 위험'],'낙하':['자재 적재 상부 낙하물 방지망 훼손','양중 자재 결속 불량'],'끼임':['컨베이어 방호덮개 미설치','장비 회전부 접근 통제 미흡'],'철근 찔림':['철근 돌출부 보호캡 미설치','노출 철근 단부 보호 미흡'],'거푸집 붕괴':['동바리 수직도 불량','거푸집 긴결재 누락'],'양중작업':['펌프카 아웃트리거 미확인','신호수 미배치','줄걸이 와이어 손상'],'감전':['분전반 접지 불량','가설전선 피복 손상'],'화재':['용접 작업 중 소화기 미비치'],'기타':['안전통로 자재 적치','위험성평가 미실시']};
 const hz=[];

 }});

function accBars(rows){

 const mx=Math.max(1,...list.map(r=>r.sanjae+r.gongsang+r.near));
 return list.map(r=>{const w=n=>(n/mx*100).toFixed(1)+'%';return `<div class="abar" onclick="showSite('${r.st.id}')"><span class="an">${esc(r.st.name)}</span><div class="at">${r.sanjae?`<i style="width:${w(r.sanjae)};background:#dc3540">${r.sanjae}</i>`:''}${r.gongsang?`<i style="width:${w(r.gongsang)};background:#f59e0b">${r.gongsang}</i>`:''}${r.near?`<i style="width:${w(r.near)};background:#3b82f6">${r.near}</i>`:''}</div></div>`}).join('');
}

const isT=v=>v===true||v==='true'||v===1||v==='1';

const vwTh=()=>+DB.settings.vwTh||10;
function vwStats(st){
 const W=(DB.vworkers||[]).filter(w=>w.siteId===st.id);let o;
 if(W.length){const act=W.filter(w=>w.status!=='퇴사');
  o={reg:W.length,total:W.length,work:W.filter(w=>(w.status||'출역')==='출역').length,absent:W.filter(w=>w.status==='미출역').length,quit:W.filter(w=>w.status==='퇴사').length,
   el:act.filter(w=>isT(w.el)).length,bp:act.filter(w=>isT(w.bp)).length,dm:act.filter(w=>isT(w.dm)).length,hr:act.filter(w=>isT(w.hr)).length};}
 else{const m=(DB.vsum||[]).filter(x=>x.siteId===st.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  if(!m)return {st,none:true,total:0,work:0,absent:0,quit:0,el:0,bp:0,dm:0,hr:null,sig:''};
  o={manual:m.date,el:+m.el||0,bp:+m.bp||0,dm:+m.dm||0,hr:(m.hr===''||m.hr==null)?null:+m.hr,work:+m.work||0,absent:+m.absent||0,quit:+m.quit||0};o.total=o.el+o.bp+o.dm;}
 const th=vwTh();o.st=st;o.sig=o.hr==null?'':o.hr>th?'red':o.hr>=Math.ceil(th*.8)?'amber':'green';return o;
}
function siteBars(rows){

 const mx=Math.max(1,...R.map(r=>r.open));const col={위험:'#dc3540',주의:'#e0a020',양호:'#22a35a'};
 return `<div class="sbh"><span>현장</span><span style="grid-column:span 2;white-space:nowrap">미조치 위험요인</span><span>취약(고위험)</span></div>`+R.map(r=>`<div class="sbr" onclick="showSite('${r.st.id}')"><span class="sn"><i style="background:${col[r.status]}"></i>${esc(r.st.name)}</span>
 <div class="at">${r.open?`<i style="width:${(r.open/mx*100).toFixed(1)}%;background:${col[r.status]}"></i>`:''}</div>
 <span class="sc">${r.open?`<b>${r.open}건</b>${r.overdue?` <b class="red">(${r.overdue})</b>`:''}`:'<span class="grn" style="font-size:12px">없음</span>'}</span>
 <span class="sv">${vwCell(r.st)}</span></div>`).join('')+`<div class="mut" style="font-size:11px;margin-top:6px">(빨간 숫자) 기한초과 · 위험한 현장부터 정렬</div>`+(state.site!=='all'?`<button class="btn primary" style="width:100%;margin-top:14px;padding:12px" onclick="state.site='all';render()">↩ 전체 현장 현황으로 돌아가기 (${DB.sites.length}개 현장)</button>`:'');

function copyText(t,okMsg){const ok=()=>toast(okMsg||'📋 복사했습니다 — 카톡에 붙여넣기 하세요');
 const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let r=false;try{r=document.execCommand('copy')}catch(e){}ta.remove();
  if(r)ok();else openModal('아래 글을 길게 눌러 복사하세요',`<textarea style="width:100%;height:200px" onclick="this.select()">${esc(t)}</textarea>`)};

let RP_SITE='all';
function repeatChart(){
 const sites=visSites();const ok=h=>RP_SITE==='all'?sites.some(x=>x.id===h.siteId):h.siteId===RP_SITE;
 let from=state.from,to=state.to;if(diffDays(to,from)<6)from=addDays(to,-6);if(diffDays(to,from)>120)from=addDays(to,-120);
 const ALL=DB.hazards.filter(h=>sites.some(x=>x.id===h.siteId)&&h.date>=from&&h.date<=to).sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)));
 const seen={};ALL.forEach(h=>{const k=h.siteId+'|'+h.type;seen[k]=(seen[k]||0)+1;h._rep=seen[k]>=2});
 const H=ALL.filter(ok);
 const days=[];for(let d=from;d<=to;d=addDays(d,1))days.push(d);
 const P=days.map(d=>{const g={};H.filter(h=>h.date<=d).forEach(h=>{const k=h.siteId+'|'+h.type;g[k]=(g[k]||0)+1});return {d,v:Object.values(g).filter(n=>n>=2).length}});
 const W=360,pl=26,pr=8,pt=10,ph=110;
 const mx=Math.max(4,...P.map(p=>p.v));
 const step=(W-pl-pr)/Math.max(1,P.length-1),X=i=>pl+i*step,Y=v=>pt+ph-v/mx*ph;
 const first=P[0].v,last=P[P.length-1].v,chg=last-first,lc=chg>0?'#ff4d5a':chg<0?'#4d8dff':'#c9d7f0';
 const line=P.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
 const area=line+` L${X(P.length-1).toFixed(1)} ${pt+ph} L${pl} ${pt+ph} Z`;
 const grid=[0,.5,1].map(f=>{const v=Math.round(mx*f),y=Y(v);return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#1f3d70" stroke-dasharray="${f?'3 4':''}"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#9fb3d6">${v}</text>`}).join('');
 const dl=`<text x="${pl}" y="${pt+ph+14}" font-size="10" fill="#7f95bd">${P[0].d.slice(5).replace('-','.')}</text><text x="${W-pr}" y="${pt+ph+14}" text-anchor="end" font-size="10" fill="#7f95bd">${P[P.length-1].d.slice(5).replace('-','.')}</text>`;
 const dots=P.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===P.length-1?4:6}" fill="${i===P.length-1?lc:'transparent'}" stroke="${i===P.length-1?'#fff':'none'}" stroke-width="1.5"><title>${p.d} 반복 항목 ${p.v}개</title></circle>`).join('');
 /* 현장별 막대 */
 const S=sites.map(st=>{const r=ALL.filter(h=>h.siteId===st.id&&h._rep);return {st,n:r.length,op:r.filter(h=>h.status!=='완료').length}}).filter(x=>x.n).sort((a,b)=>b.n-a.n||b.op-a.op);
 const bt=pt+ph+40,bh=66,lb=bt+bh+16,BH=lb+4;const bmx=Math.max(1,...S.map(x=>x.n));
 const slot=S.length?(W-pl-pr)/S.length:0,bw=Math.min(30,slot*.6);
 const bars=S.map((x,i)=>{const cx=pl+slot*(i+.5),hh=x.n/bmx*bh,ho=x.op/bmx*bh,sel=RP_SITE===x.st.id,dim=RP_SITE!=='all'&&!sel;
  return `<g style="cursor:pointer" opacity="${dim?.35:1}" onclick="event.stopPropagation();RP_SITE=RP_SITE==='${x.st.id}'?'all':'${x.st.id}';$('#rpBox').innerHTML=repeatChart()"><title>${esc(x.st.name)} 반복 발생 ${x.n}건 (미조치 ${x.op} · 조치완료 ${x.n-x.op})</title>
  <rect x="${cx-slot/2}" y="${bt-14}" width="${slot}" height="${bh+34}" fill="transparent"/>
  <rect x="${(cx-bw/2).toFixed(1)}" y="${(bt+bh-hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${(hh-ho).toFixed(1)}" fill="#4d8dff"/>
  <rect x="${(cx-bw/2).toFixed(1)}" y="${(bt+bh-ho).toFixed(1)}" width="${bw.toFixed(1)}" height="${ho.toFixed(1)}" fill="#ff4d5a"/>
  ${sel?`<rect x="${(cx-bw/2-2).toFixed(1)}" y="${(bt+bh-hh-2).toFixed(1)}" width="${(bw+4).toFixed(1)}" height="${(hh+2).toFixed(1)}" fill="none" stroke="#fff" stroke-width="1.5"/>`:''}
  <text x="${cx.toFixed(1)}" y="${(bt+bh-hh-4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">${x.n}</text>
  <text x="${cx.toFixed(1)}" y="${lb}" text-anchor="middle" font-size="${S.length>6?10:11}" fill="${sel?'#fff':'#c9d7f0'}" font-weight="${sel?800:500}">${esc(x.st.name.replace('현장',''))}</text></g>`}).join('');
 return `<div class="sk-head"><div><div class="mut" style="font-size:12px">${RP_SITE==='all'?'전체 현장':esc(siteName(RP_SITE))} · 반복 부적합 항목 추이</div>
 <div class="sk-now"><b style="color:${lc}">${last}</b><small>개</small><span style="color:${lc}">${chg>0?'▲':chg<0?'▼':'―'} ${Math.abs(chg)}개</span>${RP_SITE!=='all'?`<button class="chip" onclick="event.stopPropagation();RP_SITE='all';$('#rpBox').innerHTML=repeatChart()">전체 보기</button>`:''}</div></div>
 <div class="sk-leg"><span><i style="background:#ff4d5a"></i>미조치</span><span><i style="background:#4d8dff"></i>조치 완료</span></div></div>
 <svg viewBox="0 0 ${W} ${BH}" class="sk-svg"><defs><linearGradient id="rpg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lc}" stop-opacity=".45"/><stop offset="1" stop-color="${lc}" stop-opacity="0"/></linearGradient></defs>
 ${grid}<path d="${area}" fill="url(#rpg)"/><path d="${line}" fill="none" stroke="${lc}" stroke-width="2.2" stroke-linejoin="round"/>${dots}${dl}
 <line x1="${pl}" x2="${W-pr}" y1="${bt+bh}" y2="${bt+bh}" stroke="#2a4f90"/>${bars||`<text x="${W/2}" y="${bt+bh/2}" text-anchor="middle" font-size="12" fill="#9fb3d6">기간 내 반복 부적합 없음</text>`}</svg>
 <div class="mut" style="font-size:11px">막대를 누르면 그 현장 추이만 보기</div>`;
}

 else inp=`<input name="${f.k}" type="${f.t==='number'||f.t==='pct'?'number':f.t==='date'?'date':'text'}" value="${esc(v)}" ${f.t==='pct'?'min="0" max="100"':''} ${f.t==='number'?'min="0"':''} placeholder="${esc(f.ph||'')}">`;

function openForm(key,id,preset={}){
 const sc=SCHEMAS[key],ro=!canEdit();
 if(ro&&!id)return;
 if(key!=='sites'&&sc.fields.some(f=>f.t==='site')&&!DB.sites.length)return alert('먼저 설정에서 현장을 등록하세요.');
 let r=id?DB[key].find(x=>x.id===id):null;
 if(id&&!r)return;
 if(!r){r={};sc.fields.forEach(f=>{if(f.t==='date'&&f.k==='date')r[f.k]=today();else if(f.t==='select')r[f.k]=f.o[0];else if(f.t==='site')r[f.k]=state.site!=='all'?state.site:DB.sites[0].id;else if(f.t==='region')r[f.k]='서울'});Object.assign(r,preset)}

function saveForm(key,id){
 const sc=SCHEMAS[key],f=$('#frm'),o={};
 for(const fd of sc.fields){
  if(fd.t==='photo'){if(tmpPhotos[fd.k]!==undefined)o[fd.k]=tmpPhotos[fd.k];continue}
  if(fd.t==='check'){o[fd.k]=f[fd.k].checked;continue}
  let v=f[fd.k].value.trim();if(fd.req&&!v)return alert(fd.l+' 항목을 입력하세요.');
  if(fd.t==='number'||fd.t==='pct')v=v===''?'':Math.max(0,+v);if(fd.t==='pct'&&v!=='')v=Math.min(100,v);o[fd.k]=v;
 }
 if(key==='vworkers'&&o.age!==''&&+o.age>=65)o.el=true;
 if(key==='hazards'){if(o.status==='완료'&&!o.doneDate)o.doneDate=today();if(o.status!=='완료')o.doneDate=''}
 if(key==='edu'&&o.target!==''&&o.attended>o.target)return alert('참석 인원이 대상 인원보다 많습니다.');
 let rec;if(id){rec=DB[key].find(x=>x.id===id);Object.assign(rec,o)}else{o.id=uid();sc.fields.filter(x=>x.t==='photo').forEach(x=>o[x.k]=o[x.k]||'');DB[key].push(o);rec=o}
 closeModal();commit(key,rec);toast(id?'✔ 수정 내용을 저장했습니다':'✔ 등록했습니다');
}
function pickPhoto(inp,k){
 const file=inp.files[0];if(!file)return;const rd=new FileReader();
 rd.onload=()=>{const im=new Image();im.onload=()=>{const M=1000,s=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.72);tmpPhotos[k]=d;const p=$('#pv_'+k);p.src=d;p.style.display='block'};im.src=rd.result};
 rd.readAsDataURL(file);
}

/* ===================== 서버 연동 · 로그인 (구글 시트 + Apps Script) ===================== */
const CFGK='hse_hq_server_cfg',TOKK='hse_hq_tok';
const COLL_KEYS=['sites','hazards','edu','broadcasts','inspections','directives','notices','accidents','vworkers','vsum'];
let CFG={url:'',token:'',id:'',name:'',title:'',role:'',keep:true,localOK:false},VER='',LOGIN_OPEN=false,FIRST_CONNECT=false,LOCALSNAP=null,PULLING=false,PENDING=0,HAS_ADMIN=true,AUTH_TAB='login',AUTH_MSG='';
function loadCfg(){try{Object.assign(CFG,JSON.parse(localStorage.getItem(CFGK)||'{}'))}catch(e){}
 if(!CFG.token){try{CFG.token=sessionStorage.getItem(TOKK)||''}catch(e){}}
 if(PRESET_SERVER){CFG.url=PRESET_SERVER;CFG.localOK=false}}
function saveCfg(){const c={...CFG};if(!CFG.keep){try{sessionStorage.setItem(TOKK,CFG.token||'')}catch(e){}c.token=''}
 try{localStorage.setItem(CFGK,JSON.stringify(c))}catch(e){}}
const online=()=>!!CFG.url;
const logged=()=>online()&&!!CFG.token;
const isAdmin=()=>logged()&&CFG.role==='관리자';
const canEdit=()=>!online()||CFG.role==='관리자'||CFG.role==='입력';
const ROLE_TXT={관리자:'관리자',입력:'입력 권한',열람:'열람 전용'};
const whoAmI=()=>logged()&&CFG.name?CFG.name+(CFG.title&&CFG.title!==CFG.name?' '+CFG.title:''):DB.settings.role;
function emptyDB(){const d={settings:{role:'대표이사',company:'이재성플랫폼'}};COLL_KEYS.forEach(k=>d[k]=[]);return d}
function normalize(k,r){const o={...r};((SCHEMAS[k]||{}).fields||[]).forEach(f=>{if((f.t==='number'||f.t==='pct')&&o[f.k]!==undefined)o[f.k]=o[f.k]===''?'':+o[f.k];if(f.t==='check')o[f.k]=isT(o[f.k])});return o}
async function api(action,data={},url){
 let r,j;
 try{r=await fetch(url||CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:CFG.token,...data})})}
 catch(e){throw new Error('서버에 연결할 수 없습니다 (인터넷·서버 주소 확인)')}
 try{j=await r.json()}catch(e){throw new Error('서버 응답 오류 — 웹 앱 배포 설정(액세스: 모든 사용자)을 확인하세요')}
 if(!j.ok){const er=new Error(j.error||'서버 오류');er.auth=!!j.auth;throw er}
 return j;
}
function setSync(st,msg){const e=$('#sync');if(!e)return;const d=new Date();e.className='sync '+st;
 e.textContent=st==='ok'?`● 연동됨 ${pad(d.getHours())}:${pad(d.getMinutes())}`:st==='busy'?'● 동기화 중…':st==='err'?'● 연동 오류':'● 이 기기 저장';
 e.title=msg||(st==='off'?'서버 연동 안 함 — 설정에서 연결할 수 있습니다':'눌러서 지금 동기화')}
function renderUser(){
 const b=$('#userBox');if(!b)return;
 if(logged())b.innerHTML=`👤 <b>${esc(CFG.name||CFG.id)}</b><span class="mut" style="font-size:12px">${esc(CFG.title?CFG.title+' · ':'')}${ROLE_TXT[CFG.role]||''}</span><button class="btn sm" onclick="logout()">로그아웃</button>`;
 else if(online())b.innerHTML=`<button class="btn sm primary" onclick="lockApp()">로그인</button>`;
 else b.innerHTML=`👤<select id="roleSel" onchange="setRole(this.value)">${['대표이사','안전팀장','안전관리자'].map(o=>`<option ${o===DB.settings.role?'selected':''}>${o}</option>`).join('')}</select><button class="btn sm" onclick="CFG.localOK=false;saveCfg();lockApp()">서버 로그인</button>`;
}
function applyRole(){document.body.classList.toggle('ro',!canEdit());renderUser()}
function authFail(msg){CFG.token='';saveCfg();setSync('err',msg);lockApp(msg)}
async function pull(){
 if(!logged()||PULLING)return;PULLING=true;setSync('busy');
 try{
  const j=await api('all');Object.assign(CFG,{name:j.user.name,title:j.user.title,role:j.user.role});saveCfg();
  const d=j.data||{},empty=COLL_KEYS.every(k=>!(d[k]||[]).length);
  if(FIRST_CONNECT&&empty&&canEdit()&&LOCALSNAP&&LOCALSNAP.sites.length){
   FIRST_CONNECT=false;
   if(confirm(`서버에 아직 자료가 없습니다.\n이 PC에 있던 자료(현장 ${LOCALSNAP.sites.length}개, 위험요인 ${LOCALSNAP.hazards.length}건 등)를 서버에 올릴까요?\n\n※ 예시 자료라서 올리지 않으려면 [취소] → 설정에서 실제 현장부터 등록하세요.`)){
    COLL_KEYS.forEach(k=>DB[k]=LOCALSNAP[k]||[]);PULLING=false;pushAll();return;}
  }
  FIRST_CONNECT=false;
  COLL_KEYS.forEach(k=>DB[k]=(d[k]||[]).map(r=>normalize(k,r)));VER=j.ver;save();setSync('ok');applyRole();render();
  if(isAdmin())api('users').then(u=>{const n=u.users.filter(x=>x.status==='대기').length;if(n!==PENDING){PENDING=n;nav();if(n)toast(`👥 승인 대기 회원 ${n}명 — 「회원 관리」에서 승인하세요`)}}).catch(()=>{});
 }catch(e){if(e.auth)authFail(e.message);else setSync('err',e.message)}
 finally{PULLING=false}
}
async function commit(key,rec){
 save();render();if(!online())return;setSync('busy');
 try{const j=await api('save',{coll:key,rec});const i=DB[key].findIndex(x=>x.id===rec.id);if(i>=0)DB[key][i]=normalize(key,j.rec);const stale=j.prev!==VER;VER=j.ver;save();setSync('ok');if(stale)pull();else render()}
 catch(e){if(e.auth)return authFail(e.message);setSync('err',e.message);alert('⚠ 서버 저장 실패: '+e.message+'\n이 기기 화면에만 반영되었습니다. 인터넷 확인 후 다시 저장해 주세요.')}
}

window.addEventListener('storage',e=>{if(e.key!==LS||!e.newValue)return;try{DB=JSON.parse(e.newValue);load2();render();toast('🔄 다른 창에서 바뀐 내용을 반영했습니다')}catch(_){}});
async function remove(key,id){
 DB[key]=DB[key].filter(x=>x.id!==id);save();closeModal();render();if(!online())return;setSync('busy');
 try{const j=await api('del',{coll:key,id});const stale=j.prev!==VER;VER=j.ver;setSync('ok');if(stale)pull()}
 catch(e){setSync('err',e.message);alert('⚠ 서버 삭제 실패: '+e.message)}
}
async function pushAll(){
 setSync('busy');
 try{await api('bulk',{data:Object.fromEntries(COLL_KEYS.map(k=>[k,DB[k]]))});VER='';await pull();alert('서버에 올렸습니다. 다른 관리자 화면에도 곧 반영됩니다.')}
 catch(e){setSync('err',e.message);alert('⚠ 서버 업로드 실패: '+e.message)}
}

 if(!online()){
  body=`<h2>서버 연결</h2><p class="mut">구글 Apps Script 웹 앱 주소(…/exec)를 붙여넣으세요. 처음 한 번만 하면 됩니다.</p>
  <form onsubmit="authConnect();return false"><div class="fld"><span>서버 주소</span><input id="auSrv" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(CFG.url||'')}"></div>
  <button class="btn primary au-go" type="submit">서버 연결</button></form>
  <button class="au-link" onclick="CFG.localOK=true;saveCfg();unlockApp()">서버 없이 이 PC에서만 체험하기 (예시 자료) ›</button>`;
 }else if(AUTH_TAB==='signup'){
  body=`<div class="au-tabs"><button onclick="AUTH_TAB='login';lockApp('')">로그인</button><button class="on">회원가입</button></div>
  ${HAS_ADMIN?'<div class="note" style="margin-bottom:10px">가입 후 <b>관리자 승인</b>이 끝나야 로그인할 수 있습니다.</div>':'<div class="note" style="margin-bottom:10px;border-color:#2f80ff">⭐ 아직 회원이 없습니다. <b>지금 가입하는 분이 관리자</b>가 됩니다.</div>'}
  <form onsubmit="authSignup();return false" class="form">
  <div class="fld"><span>아이디 *</span><input id="suId" autocomplete="username" placeholder="한글·영문·숫자 2~20자"></div>
  <div class="fld"><span>이름 *</span><input id="suName" placeholder="홍길동"></div>
  <div class="fld"><span>직책</span><input id="suTitle" placeholder="예) 안전팀장, 대표이사"></div>
  <div class="fld"><span>연락처</span><input id="suPhone" placeholder="010-0000-0000"></div>
  <div class="fld"><span>비밀번호 * (4자 이상)</span><input id="suPw" type="password" autocomplete="new-password"></div>
  <div class="fld"><span>비밀번호 확인 *</span><input id="suPw2" type="password" autocomplete="new-password"></div>
  <button class="btn primary au-go wide" type="submit" style="grid-column:1/-1">가입 신청</button></form>`;
 }else{
  body=`<div class="au-tabs"><button class="on">로그인</button><button onclick="AUTH_TAB='signup';lockApp('')">회원가입</button></div>
  <form onsubmit="authLogin();return false"><div class="fld"><span>아이디</span><input id="lgId" autocomplete="username" value="${esc(CFG.id||'')}"></div>
  <div class="fld" style="margin-top:10px"><span>비밀번호</span><input id="lgPw" type="password" autocomplete="current-password"></div>
  <label class="ckb" style="margin-top:10px;background:none;border:none;padding:0"><input type="checkbox" id="lgKeep" ${CFG.keep?'checked':''}> 로그인 상태 유지 (이 PC에서 14일)</label>
  <button class="btn primary au-go" type="submit">로그인</button></form>
  <p class="mut" style="font-size:12px;margin-top:12px">비밀번호를 잊으셨으면 관리자에게 「비밀번호 초기화」를 요청하세요.</p>
  <button class="au-link" onclick="shareLink()">🔗 이 페이지 링크 복사 (카톡 공유)</button>`;
 }
 a.innerHTML=`<div class="au-box">${head}${AUTH_MSG?`<div class="au-msg ${/완료|접수|관리자가 되/.test(AUTH_MSG)?'ok':''}">${esc(AUTH_MSG)}</div>`:''}${body}
 ${online()&&!PRESET_SERVER?`<button class="au-link" onclick="if(confirm('서버 주소를 바꿀까요?')){CFG.url='';CFG.token='';saveCfg();lockApp('')}">서버 주소 변경</button>`:''}</div>`;
 setTimeout(()=>{const f=a.querySelector('input:not([type=checkbox])');if(f&&!f.value)f.focus();else{const p=a.querySelector('#lgPw');if(p)p.focus()}},30);
 if(online())fetch(CFG.url).then(r=>r.json()).then(j=>{if(j&&j.hasAdmin===false&&HAS_ADMIN){HAS_ADMIN=false;if(AUTH_TAB==='login'){AUTH_TAB='signup';lockApp('')}else lockApp()}}).catch(()=>{});
}
function unlockApp(){document.body.classList.remove('locked');const a=$('#auth');if(a)a.remove();AUTH_MSG='';applyRole();render()}
async function authConnect(){
 const u=$('#auSrv').value.trim();
 if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){AUTH_MSG='Apps Script 웹 앱 주소(https://script.google.com/…/exec)를 붙여넣으세요.';return lockApp()}
 try{const r=await fetch(u);const j=await r.json();if(!j.ok)throw 0;HAS_ADMIN=j.hasAdmin!==false}catch(e){AUTH_MSG='서버가 응답하지 않습니다. 배포 시 「액세스: 모든 사용자」로 했는지 확인하세요.';return lockApp()}
 LOCALSNAP=JSON.parse(JSON.stringify(DB));FIRST_CONNECT=true;
 Object.assign(CFG,{url:u,token:'',localOK:false});saveCfg();AUTH_TAB=HAS_ADMIN?'login':'signup';lockApp('');
}
async function authLogin(){
 const id=$('#lgId').value.trim(),pw=$('#lgPw').value;if(!id||!pw){AUTH_MSG='아이디와 비밀번호를 입력하세요.';return lockApp()}
 const btn=$('#auth .au-go');btn.disabled=true;btn.textContent='확인 중…';
 try{const j=await api('login',{id,pw});const keep=$('#lgKeep').checked;
  if(!keep){try{localStorage.removeItem(LS)}catch(e){}}
  Object.assign(CFG,{token:j.token,id:j.user.id,name:j.user.name,title:j.user.title,role:j.user.role,keep});saveCfg();
  DB=emptyDB();unlockApp();state.page='overview';location.hash='overview';setSync('busy');await pull();toast(`👋 ${j.user.name}님 환영합니다`)}
 catch(e){AUTH_MSG=e.message;lockApp()}
}
async function authSignup(){
 const g=id=>$('#'+id).value.trim();const pw=$('#suPw').value,pw2=$('#suPw2').value;
 if(!g('suId')||!g('suName')||!pw){AUTH_MSG='아이디·이름·비밀번호는 꼭 입력하세요.';return lockApp()}
 if(pw!==pw2){AUTH_MSG='비밀번호 확인이 맞지 않습니다.';return lockApp()}
 const btn=$('#auth .au-go');btn.disabled=true;btn.textContent='가입 중…';
 try{const j=await api('signup',{id:g('suId'),name:g('suName'),title:g('suTitle'),phone:g('suPhone'),pw});HAS_ADMIN=true;CFG.id=g('suId').toLowerCase();saveCfg();AUTH_TAB='login';lockApp(j.msg)}
 catch(e){AUTH_MSG=e.message;lockApp()}
}
async function logout(){if(!confirm('로그아웃할까요?'))return;try{await api('logout')}catch(e){}
 CFG.token='';saveCfg();try{sessionStorage.removeItem(TOKK);localStorage.removeItem(LS)}catch(e){}DB=emptyDB();PENDING=0;AUTH_TAB='login';setSync('off');lockApp('로그아웃했습니다.')}
function disconnect(){if(!confirm('서버 연결을 해제할까요? 이 PC에만 저장되는 방식으로 돌아갑니다.'))return;CFG={url:'',token:'',id:'',name:'',title:'',role:'',keep:true,localOK:true};saveCfg();setSync('off');applyRole();render()}
function connectServer(){CFG.localOK=false;CFG.url='';saveCfg();lockApp('')}
function bakeFile(){
 const pat='const PRESET_'+"SERVER='';",i=SRC.indexOf(pat);
 if(i<0)return alert('이 파일은 이미 서버 주소가 들어간 파일입니다.');
 dl(SRC.slice(0,i)+'const PRESET_'+"SERVER='"+CFG.url.replace(/['\\]/g,'')+"';"+SRC.slice(i+pat.length),'index.html','text/html');
}
async function changePw(){
 const o=$('#cpOld').value,n=$('#cpNew').value,n2=$('#cpNew2').value;
 if(!o||!n)return alert('현재 비밀번호와 새 비밀번호를 입력하세요.');if(n!==n2)return alert('새 비밀번호 확인이 맞지 않습니다.');
 try{await api('chpw',{old:o,pw:n});['cpOld','cpNew','cpNew2'].forEach(x=>$('#'+x).value='');toast('🔑 비밀번호를 바꿨습니다')}catch(e){if(e.auth)return authFail(e.message);alert(e.message)}
}

/* ---------- 회원 관리 (관리자) ---------- */
let MEMBERS=null;
function pgMembers(){
 if(!isAdmin())return '<div class="panel mut">관리자만 볼 수 있습니다.</div>';
 setTimeout(loadMembers,0);
 return `<div class="note" style="margin-bottom:14px">새로 가입한 사람은 <b>「대기」</b> 상태입니다. 권한(관리자·입력·열람)을 정하고 상태를 <b>「승인」</b>으로 바꾼 뒤 저장하면 로그인할 수 있습니다.<br>· <b>관리자</b>: 모든 입력 + 회원 관리 · <b>입력</b>: 안전팀장 등 자료 입력·수정 · <b>열람</b>: 대표이사·임원 등 보기만</div><div id="memBox"><div class="panel mut">회원 목록을 불러오는 중…</div></div>`;
}
async function loadMembers(){
 const box=$('#memBox');if(!box)return;
 try{const j=await api('users');MEMBERS=j.users;PENDING=j.users.filter(x=>x.status==='대기').length;nav()}catch(e){if(e.auth)return authFail(e.message);box.innerHTML=`<div class="panel red">${esc(e.message)}</div>`;return}
 const sel=(nm,v,o)=>`<select name="${nm}">${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
 const L=MEMBERS.slice().sort((a,b)=>(a.status==='대기'?0:1)-(b.status==='대기'?0:1)||String(a.joined).localeCompare(String(b.joined)));
 box.innerHTML=`<div class="panel"><h3>회원 목록 <small>${MEMBERS.length}명${PENDING?` · <b class="red">승인 대기 ${PENDING}명</b>`:''}</small></h3><div class="tw"><table class="t mem"><thead><tr><th>아이디</th><th>이름</th><th>직책</th><th>연락처</th><th>권한</th><th>상태</th><th>가입일</th><th>최근 로그인</th><th></th></tr></thead><tbody>
 ${L.map(m=>`<tr data-id="${esc(m.id)}" ${m.status==='대기'?'style="background:#2a1f0a"':''}><td><b>${esc(m.id)}</b>${m.id===CFG.id?' <span class="mut">(나)</span>':''}</td><td>${esc(m.name)}</td><td><input name="title" value="${esc(m.title)}" style="width:110px"></td><td>${esc(m.phone)}</td>
 <td>${sel('role',m.role,['관리자','입력','열람'])}</td><td>${sel('status',m.status,['대기','승인','중지'])}</td><td class="mut">${esc(m.joined)}</td><td class="mut">${esc(m.last||'-')}</td>
 <td style="white-space:nowrap"><button class="btn sm primary" onclick="memSave(this)">${m.status==='대기'?'승인 저장':'저장'}</button> <button class="btn sm" onclick="memReset(this)">비번 초기화</button> ${m.id===CFG.id?'':`<button class="btn sm danger" onclick="memDel(this)">삭제</button>`}</td></tr>`).join('')}
 </tbody></table></div></div>`;
}
async function memSave(b){const tr=b.closest('tr'),id=tr.dataset.id;const g=n=>tr.querySelector(`[name=${n}]`).value;
 let st=g('status');const m=MEMBERS.find(x=>x.id===id);if(m.status==='대기'&&st==='대기'&&b.textContent==='승인 저장')st='승인';
 try{await api('setuser',{id,role:g('role'),status:st,title:g('title')});toast(`✔ ${id} — ${g('role')} · ${st}`);if(id===CFG.id){CFG.role=g('role');saveCfg();applyRole()}loadMembers()}catch(e){if(e.auth)return authFail(e.message);alert(e.message)}}
async function memReset(b){const id=b.closest('tr').dataset.id;const pw=prompt(`${id} 님의 임시 비밀번호를 입력하세요 (4자 이상)\n본인에게 알려주고, 로그인 후 「설정 → 비밀번호 변경」에서 바꾸게 하세요.`);if(!pw)return;
 try{await api('resetpw',{id,pw});toast(`🔑 ${id} 비밀번호를 초기화했습니다`)}catch(e){if(e.auth)return authFail(e.message);alert(e.message)}}
async function memDel(b){const id=b.closest('tr').dataset.id;armDelete(b,async()=>{try{await api('deluser',{id});toast(`🗑 ${id} 회원을 삭제했습니다`);loadMembers()}catch(e){if(e.auth)return authFail(e.message);alert(e.message)}})}

/* ===================== 시작 ===================== */
function tick(){const d=new Date(),w='일월화수목금토'[d.getDay()];$('#clock').textContent=`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} (${w}) ${pad(d.getHours())}:${pad(d.getMinutes())}`}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(PAGES[p]&&p!==state.page){state.page=p;render()}});
loadCfg();if(online()&&!CFG.token){try{localStorage.removeItem(LS)}catch(e){}}load();initState();save();applyRole();setInterval(tick,30000);
setSync(online()?'busy':'off');
if(logged()){render();pull()}else if(online()||!CFG.localOK)lockApp();else render();
setInterval(async()=>{if(!logged()||document.hidden||PULLING)return;try{const j=await api('ver');if(j.ver!==VER)pull();else setSync('ok')}catch(e){if(e.auth)authFail(e.message);else setSync('err',e.message)}},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&logged())pull()});
</script></body></html>
