<title>이재성 플랫폼 | 본사 통합 안전현황</title>
<style>
:root{--bg:#18305a;--line:#1f3d70;--tx:#e6eefc;--mut:#8ea6cf;--blue:#2f80ff;--red:#ef4444;--org:#f59e0b;--yel:#facc15;--grn:#22c55e}
*{box-sizing:border-box}
body{margin:0;font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
a{color:inherit}
.top{height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#112349;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.logo{font-weight:800;font-size:21px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo svg{width:30px;height:30px}
.top .sub{color:var(--mut);font-size:12px;white-space:nowrap}
.top .sp{flex:1}
.top .slog{color:#c9d7f0;font-size:13px;white-space:nowrap}
.top .clock{color:#c9d7f0;font-size:13px;white-space:nowrap}
.user{display:flex;align-items:center;gap:6px;border-left:1px solid var(--line);padding-left:12px}
.user select{background:transparent;border:none;color:#fff;font-weight:700;padding:4px}
.hamb{display:none;background:none;border:1px solid var(--line);color:#fff;border-radius:8px;font-size:18px;padding:4px 10px;cursor:pointer}
.wrap{display:flex}
.side{width:212px;flex:none;background:#142852;border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.side .grp{color:#b8c9e8;font-size:13px;margin:14px 6px 6px;font-weight:700;padding-top:12px;border-top:1px solid var(--line)}
.side a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;color:#c9d7f0;text-decoration:none;cursor:pointer;font-size:14px;margin:1px 0}
.side a:hover{background:#0f2550}
.side a.on{background:#14336f;color:#fff;font-weight:700}
.side a.head{background:var(--blue);color:#fff;font-weight:800;margin-bottom:6px}
.side .ico{width:20px;text-align:center}
main{flex:1;min-width:0;padding:18px}
.phead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.phead h1{margin:0;font-size:24px}
.phead p{margin:4px 0 0;color:var(--mut)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:#0b1d40;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 10px;font:inherit;max-width:100%}
input[type=date]{color-scheme:dark}
textarea{resize:vertical}
.btn{background:#13306a;border:1px solid #2a4f90;color:#dce8ff;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{background:#5b1620;border-color:#a3243a;color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.ghost{background:transparent;border-color:#2f6fe0;color:#cfe0ff}
.panel{background:linear-gradient(180deg,#122e68,#0e2454);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.panel h3{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3 small{font-size:12px;color:var(--mut);font-weight:500}
.panel h3 .lnk{font-size:12px;color:#9cc0ff;font-weight:500;cursor:pointer}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}
.dside{display:flex;flex-direction:column;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{display:flex;gap:14px;align-items:center;cursor:pointer}
.kpi:hover{border-color:#3c6cc0}
.kpi .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;flex:none}
.kpi .ic svg{width:28px;height:28px}
.kpi .lb{font-weight:700;font-size:15px}
.kpi .v{font-size:38px;font-weight:800;line-height:1.15}
.kpi .v small{font-size:17px;margin-left:4px}
.kpi .s{color:var(--mut);font-size:12px}
.row2,.row3{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;margin-top:14px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.sitebox .t td,.sitebox .t th{white-space:nowrap}
.sk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sk-now{display:flex;align-items:baseline;gap:6px;margin:2px 0}
.sk-now b{font-size:30px;line-height:1.1;font-weight:800}.sk-now small{font-size:14px;color:var(--mut)}.sk-now span{font-weight:800;font-size:14px}
.sk-leg{display:flex;gap:10px;font-size:11px;color:var(--mut)}.sk-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.sk-svg{width:100%;height:auto;display:block;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:#0a1a3a;border:1px solid var(--line);color:#c9d7f0;border-radius:999px;padding:3px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.chip.on{background:#2f80ff;border-color:#2f80ff;color:#fff;font-weight:700}
.sbh{display:grid;grid-template-columns:92px 1fr 58px 70px;gap:8px;font-size:12px;color:var(--mut);padding:0 4px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sbh span:last-child{text-align:right}

.sbr:hover{background:#122a5a}
.sbr .sn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.sbr .sn i{width:8px;height:8px;border-radius:50%;flex:none}
.sbr .at{height:14px}
.sbr .sc{font-size:12.5px;white-space:nowrap}
.sbr .at i{white-space:nowrap;padding:0 6px;min-width:34px}
.sbr .at em{font-style:normal;font-size:11px;color:#4ade80;padding-left:6px;display:flex;align-items:center}
.sbr .sv{text-align:right;font-size:12px;white-space:nowrap}
.sitebox{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;align-items:start}
.map svg{width:100%;height:auto;display:block}
.map .pin{cursor:pointer}
.legend{display:flex;gap:12px;font-size:13px;color:#c9d7f0;font-weight:500}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{color:var(--mut);font-weight:600;text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:7px 6px;border-bottom:1px solid #16305e;vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:#122a5a}
.t td.num,.t th.num{text-align:right}
.empty{text-align:center;color:var(--mut);padding:24px!important}
.bd{display:inline-block;padding:2px 11px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.bd.r{background:#dc3540}.bd.o{background:none;color:#fbbf24}.bd.g{background:none;color:#4ade80}.bd.b{background:none;color:#7fb0ff}.bd.gr{background:none;color:#94a3b8}
.red{color:#ff6b6b;font-weight:700}.org{color:#ffb547;font-weight:700}.grn{color:#4ade80;font-weight:700}.mut{color:var(--mut)}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.leg{flex:1;min-width:170px}
.leg div{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.leg i{width:11px;height:11px;border-radius:50%;flex:none}
.leg b{margin-left:auto;font-weight:600}
.leg em{color:var(--mut);font-style:normal;width:50px;text-align:right}
.bar{display:grid;grid-template-columns:96px 1fr 46px;gap:8px;align-items:center;font-size:13px;padding:4px 0;cursor:pointer}
.bar .tr{height:14px;background:#0a1a3a;border-radius:3px;overflow:hidden}
.bar .fl{height:100%;border-radius:3px}
.bar .pc{text-align:right}
.alertp{border-color:#b4232f;background:linear-gradient(180deg,#2a0f22,#170f2c)}
.alerts .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #3a2140;cursor:pointer}
.alerts .it:last-child{border-bottom:none}
.alerts .tag{width:48px;height:36px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:#fff}
.alerts .tx{flex:1;min-width:0}
.alerts .tx b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alerts .tx span{font-size:12px;color:var(--mut)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;border:1px solid #2a4f90;background:#0f2a5c;cursor:pointer}
.stat.g{background:#0b3b3a;border-color:#16806a}
.stat.r{background:#3d1424;border-color:#c0303f}.stat.r .si{background:#d03a48!important}
.stat .si{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:#1d4ea8;flex:none}
.stat.g .si{background:#15805e}
.stat .l{font-size:11.5px;color:#c9d7f0;white-space:nowrap}
.stat .n{font-size:21px;white-space:nowrap;font-weight:800}
.stat .n small{font-size:13px;margin-left:3px;font-weight:600}
.notice{list-style:none;margin:0;padding:0}
.notice li{display:flex;gap:8px;padding:7px 0;font-size:13px;border-bottom:1px solid #16305e;cursor:pointer}
.notice li:before{content:'•';color:#5b9bff}
.notice li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice li em{color:var(--mut);font-style:normal}
.slogan{min-height:150px;border:1px solid var(--line);border-radius:12px;padding:20px;background:linear-gradient(160deg,#1b4a9a 0%,#0c2252 55%,#2a1c3c 100%);position:relative;overflow:hidden}
.slogan b{font-size:24px;line-height:1.35;display:block}
.slogan p{color:#bcd0f2;font-size:13px;margin:10px 0 0}

.prog{height:8px;background:#0a1a3a;border-radius:4px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--blue)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar .sp{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{cursor:pointer}
.card .ttl{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;margin-bottom:10px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mini div{background:#0a1a3a;border-radius:8px;padding:8px 4px}
.mini b{display:block;font-size:20px}
.mini span{font-size:11px;color:var(--mut)}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.sumrow .panel{text-align:center;padding:12px}
.sumrow b{display:block;font-size:26px}
.sumrow span{color:var(--mut);font-size:12px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gal .pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}

.gal .pair em{position:absolute;left:4px;top:4px;background:#000a;color:#fff;font-style:normal;font-size:11px;padding:1px 6px;border-radius:4px}
.thumb{width:46px;height:34px;object-fit:cover;border-radius:4px;cursor:pointer;vertical-align:middle}
.modal-bg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:250;padding:12px}

.modal{background:#0d2147;border:1px solid var(--line);border-radius:14px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.modal .mh button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.modal .mb{padding:16px 18px;overflow:auto}

.modal .mf .left{margin-right:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;color:var(--mut);font-weight:600}
.fld.wide{grid-column:1/-1}
.phbox img{max-width:240px;max-height:170px;border-radius:8px;display:block;margin-bottom:6px}
.note{background:#0a1a3a;border:1px dashed #2a4f90;border-radius:10px;padding:12px 14px;color:#c9d7f0;font-size:13px;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rpt-head{display:none}
body.ro .ed{display:none!important}
.hrsec{border-top:1px solid var(--line);margin-top:6px}
.hrbox{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px}
.hrleft{display:flex;flex-direction:column;gap:8px}
.hrstat{background:#0a1a3a;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:center}
.hrstat span{display:block;font-size:12px;color:#c9d7f0;background:#13306a;border-radius:6px;padding:2px 0;margin:-2px -4px 4px}
.hrstat.on span{background:#2f80ff;color:#fff}.hrstat.hot{border-color:#dc3540}.hrstat.hot span{background:#5b1620}

.hrgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.hrt span{display:block;font-size:10.5px;letter-spacing:-.5px;color:#c9d7f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrt b{font-size:18px}.hrt b small{font-size:11px;margin-left:1px}
@media (max-width:760px){.hrbox{grid-template-columns:1fr}.hrleft{flex-direction:row}.hrleft>div:first-child{display:none}.hrstat{flex:1}.hrgrid{grid-template-columns:repeat(4,1fr)}}
body.notadm .adm{display:none!important}
body.locked .top,body.locked .wrap{display:none!important}
#auth{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;background:radial-gradient(1200px 600px at 20% 0%,#1b4a9a55,transparent),linear-gradient(160deg,#0b1f45,#06122a 60%)}
.au-box{width:min(460px,100%);background:#0e2350;border:1px solid #2a4f90;border-radius:16px;padding:26px 26px 18px;box-shadow:0 20px 60px #0009}

.au-box .fld input{padding:11px 12px;font-size:15px}

.au-msg{background:#3d1424;border:1px solid #dc3540;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;font-weight:600}
.au-msg.ok{background:#0b3b2a;border-color:#22a35a}
.pend{background:#dc3540;color:#fff;border-radius:999px;font-size:11px;padding:0 7px;margin-left:4px}

function initState(){const t=today();state={from:t.slice(0,8)+'01',to:t,site:'all',page:(location.hash||'#overview').slice(1)};if(!PAGES[state.page])state.page='overview'}
const inRange=d=>d&&d>=state.from&&d<=state.to;
const siteOk=id=>state.site==='all'||id===state.site;
const visSites=()=>DB.sites.filter(s=>siteOk(s.id));
const siteName=id=>(DB.sites.find(s=>s.id===id)||{}).name||'(삭제된 현장)';
function siteStats(st){
 const T=today();
 const hz=DB.hazards.filter(h=>h.siteId===st.id);
 const open=hz.filter(h=>h.status!=='완료'&&h.date<=state.to);
 const overdue=open.filter(h=>h.due&&h.due<T);
 const inP=hz.filter(h=>inRange(h.date));
 const done=inP.filter(h=>h.status==='완료').length;
 const ed=DB.edu.filter(e=>e.siteId===st.id&&inRange(e.date));
 const tgt=sum(ed,e=>e.target),att=sum(ed,e=>e.attended);
 const recent=DB.edu.filter(e=>e.siteId===st.id&&e.date<=state.to&&e.date>=addDays(state.to,-6)).length;
 const ins=DB.inspections.filter(x=>x.siteId===st.id&&inRange(x.date));
 const bc=DB.broadcasts.filter(x=>x.siteId===st.id&&inRange(x.date));
 const ac=(DB.accidents||[]).filter(x=>x.siteId===st.id&&inRange(x.date));
 let status='양호';if(overdue.length||open.length>=4)status='위험';else if(open.length)status='주의';
 return {st,open:open.length,overdue:overdue.length,found:inP.length,done,doneRate:inP.length?Math.round(done/inP.length*100):100,
  tgt,att,miss:Math.max(0,tgt-att),rate:tgt?Math.round(att/tgt*100):null,eduCnt:ed.length,recent,
  insCnt:ins.length,insAvg:ins.length?Math.round(sum(ins,x=>x.score)/ins.length):null,bcCnt:sum(bc,x=>x.count||1),sanjae:ac.filter(x=>x.kind==='산재').length,gongsang:ac.filter(x=>x.kind==='공상').length,near:ac.filter(x=>x.kind==='아차사고').length,status};
}

function dueLabel(r){
 if(!r.due)return '<span class="mut">-</span>';
 if(String(r.status).startsWith('완료'))return esc(r.due);
 const d=diffDays(r.due,today());
 if(d<0)return `<span class="red">${r.due} (기한초과 ${-d}일)</span>`;
 return `<span class="${d<=1?'red':d<=3?'org':''}">${r.due} (${d===0?'오늘':d+'일 남음'})</span>`;
}

async function vwFile(inp){const f=inp.files[0];if(!f)return;

  else o=JSON.parse(await f.text());if(!o||!o.sites)throw 0;vwDoImport(o,f.name)}catch(e){alert('불러올 수 없는 파일입니다. 취약근로자 프로그램의 JSON 또는 PDF 백업 파일을 선택하세요.')}}

async function tyFile(){
 const file=await new Promise(ok=>{const i=document.createElement('input');i.type='file';i.accept='.xlsx';i.onchange=()=>ok(i.files[0]);i.click()});if(!file)return;
 try{toast('엑셀 읽는 중…');const EJ=await loadLib('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js','ExcelJS');const wb=new EJ.Workbook();await wb.xlsx.load(await file.arrayBuffer());
  const T=v=>cellT(v).replace(/\s+/g,' ').trim(),grid=ws=>{const g=[];ws.eachRow({includeEmpty:true},(row,rn)=>{const a=[];for(let c=1;c<=ws.columnCount;c++){const cell=row.getCell(c);let v=cell.value;if(cell.isMerged&&cell.master&&cell.master!==cell)v=null;a.push(T(v))}g[rn-1]=a});for(let i=0;i<g.length;i++)g[i]=g[i]||[];return g};
  let days=[],F={},names=0,topic='';
  wb.eachSheet(ws=>{const g=grid(ws);
   const lab=k=>{for(const r of g){const i=r.findIndex(x=>x.replace(/\s/g,'')===k);if(i>=0){const v=r.slice(i+1).find(x=>x);if(v)return v}}return ''};
   if(!F.rSite)F.rSite=lab('현장명');if(!F.rKind)F.rKind=lab('교육구분');if(!F.rWho)F.rWho=lab('교육실시자');
   const hi=g.findIndex(r=>r.some(x=>x.replace(/\s/g,'')==='교육일자'));
   if(hi>=0){const H=g[hi].map(x=>x.replace(/\s/g,'')),ci=k=>H.findIndex(x=>x===k||x.startsWith(k));const cD=ci('교육일자'),cT=ci('교육시간'),cR=ci('실시시간'),cL=ci('교육언어'),cN=ci('방송');
    for(let i=hi+1;i<g.length;i++){const r=g[i],m=(r[cD]||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);if(!m){if(r.every(x=>!x))break;continue}
     days.push({date:m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]),time:(r[cT]||'').replace(/\s/g,''),dur:r[cR]||'',langs:r[cL]||'',n:parseInt(r[cN])||1,topic:'',note:''})}

   if(ni>=0){const cols=g[ni].map((x,i)=>x.replace(/\s/g,'')==='성명'?i:-1).filter(i=>i>=0);for(let i=ni+1;i<g.length;i++)cols.forEach(c=>{if(g[i][c])names++})}});
  if(!days.length)return alert('통역시스템 교육 기록 엑셀이 아닙니다.\n(통역시스템 「📋 교육 기록 · 증빙 출력 → 📊 엑셀로 받기」로 받은 파일을 넣어 주세요)');
  days.forEach(d=>{d.topic=topic||((F.rKind||'안전교육')+' (다국어 통역)');d.note='통역시스템 엑셀: '+file.name+(d.dur?' · 실시 '+d.dur:'')});

function rowsOf(key,opt={}){
 const sc=SCHEMAS[key];let r=DB[key].slice();
 if(sc.fields.some(f=>f.k==='siteId'))r=r.filter(x=>siteOk(x.siteId));
 if(opt.range!==false&&['hazards','edu','broadcasts','inspections','accidents','hrwork','risks'].includes(key))r=r.filter(x=>inRange(x.date));
 if(opt.filter)r=r.filter(opt.filter);
 return r.sort(opt.sort||((a,b)=>(b.date||b.name||'').localeCompare(a.date||a.name||'')));
}
function cell(f,r){
 const v=r[f.k];
 if(f.k==='siteId')return esc(siteName(v));
 if(f.k==='_rate'){const p=r.target?Math.round(r.attended/r.target*100):null;return p==null?'-':`<span style="color:${rateColor(p)};font-weight:700">${p}%</span>`}
 if(f.k==='_risk')return raBadge(r.freq,r.sev);
 if(f.k==='_after')return r.afterF&&r.afterS?raBadge(r.afterF,r.afterS):'<span class="mut">-</span>';
 if(f.k==='_health')return vtags(r);
 if(f.k==='permit')return isT(v)?'<b class="grn">✓ 확인</b>':'<b class="red">미확인</b>';
 if(f.t==='check')return isT(v)?'<b class="red">✓</b>':'';
 if(f.k==='name'&&r.trade!==undefined&&DB.settings.vwMask)return esc(maskName(v));
 if(f.k==='_st')return badge((+r.progress||0)>=100?'완료':'진행중');
 if(f.t==='photo')return v?`<img class="thumb" src="${v}" onclick="event.stopPropagation();viewImg(this.src)">`:'<span class="mut">-</span>';
 if(f.k==='status'||f.k==='result'||['산재','공상','아차사고'].includes(v))return badge(v);
 if(f.k==='due'&&r.status!==undefined)return dueLabel(r);
 if(f.t==='pct')return `<div style="display:flex;gap:6px;align-items:center"><div class="prog"><i style="width:${+v||0}%"></i></div>${+v||0}%</div>`;
 if(f.k==='desc'||f.k==='findings'||f.k==='action'||f.k==='text')return `<span style="display:inline-block;max-width:320px">${esc(v)}</span>`;
 return esc(v);
}

let RP_SITE='all';
function repeatChart(){
 const sites=visSites();const ok=h=>RP_SITE==='all'?sites.some(x=>x.id===h.siteId):h.siteId===RP_SITE;
 let from=state.from,to=state.to;if(diffDays(to,from)<6)from=addDays(to,-6);if(diffDays(to,from)>120)from=addDays(to,-120);
 const ALL=DB.hazards.filter(h=>sites.some(x=>x.id===h.siteId)&&h.date>=from&&h.date<=to).sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)));
 const seen={};ALL.forEach(h=>{const k=h.siteId+'|'+h.type;seen[k]=(seen[k]||0)+1;h._rep=seen[k]>=2});
 const H=ALL.filter(ok);
 const days=[];for(let d=from;d<=to;d=addDays(d,1))days.push(d);
 const P=days.map(d=>{const g={};H.filter(h=>h.date<=d).forEach(h=>{const k=h.siteId+'|'+h.type;g[k]=(g[k]||0)+1});return {d,v:Object.values(g).filter(n=>n>=2).length}});
 const W=360,pl=26,pr=8,pt=10,ph=110;
 const mx=Math.max(4,...P.map(p=>p.v));
 const step=(W-pl-pr)/Math.max(1,P.length-1),X=i=>pl+i*step,Y=v=>pt+ph-v/mx*ph;
 const first=P[0].v,last=P[P.length-1].v,chg=last-first,lc=chg>0?'#ff4d5a':chg<0?'#4d8dff':'#888';
 const line=P.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
 const area=line+` L${X(P.length-1).toFixed(1)} ${pt+ph} L${pl} ${pt+ph} Z`;
 const grid=[0,.5,1].map(f=>{const v=Math.round(mx*f),y=Y(v);return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e3e5e8" stroke-dasharray="${f?'3 4':''}"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#888">${v}</text>`}).join('');
 const dl=`<text x="${pl}" y="${pt+ph+14}" font-size="10" fill="#999">${P[0].d.slice(5).replace('-','.')}</text><text x="${W-pr}" y="${pt+ph+14}" text-anchor="end" font-size="10" fill="#999">${P[P.length-1].d.slice(5).replace('-','.')}</text>`;
 const dots=P.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===P.length-1?4:6}" fill="${i===P.length-1?lc:'transparent'}" stroke="${i===P.length-1?'#fff':'none'}" stroke-width="1.5"><title>${p.d} 반복 항목 ${p.v}개</title></circle>`).join('');
 /* 현장별 막대 */
 const S=sites.map(st=>{const r=ALL.filter(h=>h.siteId===st.id&&h._rep);return {st,n:r.length,op:r.filter(h=>h.status!=='완료').length}}).filter(x=>x.n).sort((a,b)=>b.n-a.n||b.op-a.op);
 const bt=pt+ph+40,bh=66,lb=bt+bh+16,BH=lb+4;const bmx=Math.max(1,...S.map(x=>x.n));
 const slot=S.length?(W-pl-pr)/S.length:0,bw=Math.min(30,slot*.6);
 const bars=S.map((x,i)=>{const cx=pl+slot*(i+.5),hh=x.n/bmx*bh,ho=x.op/bmx*bh,sel=RP_SITE===x.st.id,dim=RP_SITE!=='all'&&!sel;

 if(($('#rsTxt').value||'').replace(/\s/g,'')!=='초기화')return alert('확인 칸에 「초기화」라고 정확히 입력해야 실행됩니다.');
 if(ks.includes('sites')&&!confirm('현장 목록까지 지우면 모든 화면이 빈 상태가 되고, 현장을 다시 등록해야 합니다.\n정말 지울까요?'))return;
 const n=ks.reduce((a,k)=>a+(DB[k]||[]).length,0);
 backup();
 if(ks.includes('vworkers'))ks.push('vsum');
 if(online()){setSync('busy');
  try{const data={};ks.forEach(k=>data[k]=[]);await api('bulk',{data});ks.forEach(k=>DB[k]=[]);save();VER='';await pull();setSync('ok')}
  catch(e){if(e.auth)return authFail(e.message);setSync('err',e.message);return alert('⚠ 서버 초기화 실패: '+e.message+'\n서버 자료는 그대로입니다.')}}
 else{ks.forEach(k=>DB[k]=[]);save()}
 closeModal();render();toast(`🧹 ${RESET_ITEMS.filter(x=>ks.includes(x[0])).length}개 항목 · ${n}건을 지웠습니다 (백업 파일 저장됨)`);
}
function backup(){dl(JSON.stringify(DB),`안전현황_대시보드_백업_${today()}.json`,'application/json')}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.sites)throw 0;DB=d;load2();replaceAll();alert('불러오기 완료')}catch(e){alert('올바른 백업 파일이 아닙니다.')}};r.readAsText(f)}
function load2(){DB.settings=DB.settings||{role:'대표이사',company:'이재성플랫폼'};['hazards','edu','broadcasts','inspections','directives','notices','sites','accidents','vworkers','vsum','hrwork','risks','goals'].forEach(k=>DB[k]=DB[k]||[]);syncVTR()}

/* ===================== 모달 / 입력폼 ===================== */
function openModal(title,body,btns=[]){
 $('#mt').innerHTML=title;$('#mbg .mh button').style.display='';$('#mb').innerHTML=body;const mf=$('#mf');mf.innerHTML='';
 btns.filter(Boolean).forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.cls||'');e.textContent=b.t;e.onclick=b.fn;mf.appendChild(e)});
 mf.style.display=btns.length?'':'none';$('#mbg').classList.add('on');
}
function closeModal(){$('#mbg').classList.remove('on')}
function viewImg(src){openModal('사진 보기',`<img src="${src}" style="max-width:100%;display:block;margin:0 auto;border-radius:8px">`)}
function fieldHtml(f,v){
 v=v??'';let inp;
 if(f.t==='select')inp=`<select name="${f.k}">${f.o.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
 else if(f.t==='site')inp=`<select name="${f.k}">${DB.sites.map(s=>`<option value="${s.id}" ${s.id==v?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`;
 else if(f.t==='region')inp=`<select name="${f.k}">${Object.keys(REGIONS).map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`;
 else if(f.t==='textarea')inp=`<textarea name="${f.k}" rows="3">${esc(v)}</textarea>`;
 else if(f.t==='check')inp=`<label class="ckb"><input type="checkbox" name="${f.k}" ${isT(v)?'checked':''}> 해당</label>`;
 else if(f.t==='photo')inp=`<div class="phbox"><img id="pv_${f.k}" src="${v}" style="${v?'':'display:none'}"><label class="btn sm ed">📷 사진 선택/촬영<input type="file" accept="image/*" hidden onchange="pickPhoto(this,'${f.k}')"></label> <button type="button" class="btn sm ed" onclick="clearPhoto('${f.k}')">지우기</button></div>`;
 else inp=`<input name="${f.k}" type="${f.t==='number'||f.t==='pct'?'number':f.t==='date'?'date':'text'}" value="${esc(v)}" ${f.t==='pct'?'min="0" max="100"':''} ${f.t==='number'?'min="0"':''} placeholder="${esc(f.ph||'')}">`;
 return `<div class="fld ${f.wide||f.t==='textarea'||f.t==='photo'?'wide':''}"><span>${f.l}${f.req?' <b class="red">*</b>':''}</span>${inp}</div>`;
}
function openForm(key,id,preset={}){
 const sc=SCHEMAS[key],ro=!canEdit()||(ADMK.includes(key)&&online()&&!isAdmin());
 if(ro&&!id)return;
 if(key!=='sites'&&sc.fields.some(f=>f.t==='site')&&!DB.sites.length)return alert('먼저 설정에서 현장을 등록하세요.');
 let r=id?DB[key].find(x=>x.id===id):null;
 if(id&&!r)return;
 if(!r){r={};sc.fields.forEach(f=>{if(f.t==='date'&&f.k==='date')r[f.k]=today();else if(f.t==='select')r[f.k]=f.o[0];else if(f.t==='site')r[f.k]=state.site!=='all'?state.site:DB.sites[0].id;else if(f.t==='region')r[f.k]='서울'});Object.assign(r,preset)}
 tmpPhotos={};
 openModal(`${id?(ro?'상세 보기':'상세 / 수정'):'신규 등록'} — ${sc.title}`,`<form id="frm" class="form" onsubmit="return false">${sc.fields.map(f=>fieldHtml(f,r[f.k])).join('')}</form>`,ro?[{t:'닫기',cls:'primary',fn:closeModal}]:[
  id?{t:'삭제',cls:'danger left',fn:function(){armDelete(this,()=>{remove(key,id);toast('🗑 삭제했습니다 — 대시보드에 바로 반영됨')})}}:null,
  {t:'취소',fn:closeModal},{t:'저장',cls:'primary',fn:()=>saveForm(key,id)}]);
 if(ro)$('#frm').querySelectorAll('input,select,textarea').forEach(e=>e.disabled=true);
}
function saveForm(key,id){
 const sc=SCHEMAS[key],f=$('#frm'),o={};
 for(const fd of sc.fields){
  if(fd.t==='photo'){if(tmpPhotos[fd.k]!==undefined)o[fd.k]=tmpPhotos[fd.k];continue}
  if(fd.t==='check'){o[fd.k]=f[fd.k].checked;continue}
  let v=f[fd.k].value.trim();if(fd.req&&!v)return alert(fd.l+' 항목을 입력하세요.');
  if(fd.t==='number'||fd.t==='pct')v=v===''?'':Math.max(0,+v);if(fd.t==='pct'&&v!=='')v=Math.min(100,v);o[fd.k]=v;
 }
 if(key==='vworkers'&&o.age!==''&&+o.age>=65)o.el=true;
 if(key==='hazards'){if(o.status==='완료'&&!o.doneDate)o.doneDate=today();if(o.status!=='완료')o.doneDate=''}
 if(key==='edu'&&o.target!==''&&o.attended>o.target)return alert('참석 인원이 대상 인원보다 많습니다.');
 let rec;if(id){rec=DB[key].find(x=>x.id===id);Object.assign(rec,o)}else{o.id=uid();sc.fields.filter(x=>x.t==='photo').forEach(x=>o[x.k]=o[x.k]||'');DB[key].push(o);rec=o}
 closeModal();commit(key,rec);toast(id?'✔ 수정 내용을 저장했습니다':'✔ 등록했습니다');
}
function pickPhoto(inp,k){
 const file=inp.files[0];if(!file)return;const rd=new FileReader();
 rd.onload=()=>{const im=new Image();im.onload=()=>{const M=1000,s=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.72);tmpPhotos[k]=d;const p=$('#pv_'+k);p.src=d;p.style.display='block'};im.src=rd.result};
 rd.readAsDataURL(file);
}
function clearPhoto(k){tmpPhotos[k]='';const p=$('#pv_'+k);p.removeAttribute('src');p.style.display='none'}

/* ===================== 서버 연동 · 로그인 (구글 시트 + Apps Script) ===================== */
const CFGK='hse_hq_server_cfg'+NS,TOKK='hse_hq_tok'+NS;
const COLL_KEYS=['sites','hazards','edu','broadcasts','inspections','directives','notices','accidents','vworkers','vsum','hrwork','risks','goals'];
let CFG={url:'',token:'',id:'',name:'',title:'',role:'',keep:true,localOK:false},VER='',LOGIN_OPEN=false,FIRST_CONNECT=false,LOCALSNAP=null,PULLING=false,PENDING=0,HAS_ADMIN=true,AUTH_TAB='login',AUTH_MSG='';
function loadCfg(){try{Object.assign(CFG,JSON.parse(localStorage.getItem(CFGK)||'{}'))}catch(e){}
 if(!CFG.token){try{CFG.token=sessionStorage.getItem(TOKK)||''}catch(e){}}
 if(PRESET_SERVER){CFG.url=PRESET_SERVER;CFG.localOK=false}}
function saveCfg(){const c={...CFG};if(!CFG.keep){try{sessionStorage.setItem(TOKK,CFG.token||'')}catch(e){}c.token=''}
 try{localStorage.setItem(CFGK,JSON.stringify(c))}catch(e){}}
const online=()=>!!CFG.url;
const logged=()=>online()&&!!CFG.token;
const isAdmin=()=>logged()&&CFG.role==='관리자';
const canEdit=()=>!online()||CFG.role==='관리자'||CFG.role==='입력';
const ROLE_TXT={관리자:'관리자',입력:'입력 권한',열람:'열람 전용'};
const whoAmI=()=>logged()&&CFG.name?CFG.name+(CFG.title&&CFG.title!==CFG.name?' '+CFG.title:''):DB.settings.role;
function emptyDB(){const d={settings:{role:'대표이사',company:PRESET_COMPANY||'이재성플랫폼'}};COLL_KEYS.forEach(k=>d[k]=[]);return d}
function normalize(k,r){const o={...r};if(k==='edu'&&o.lang==='다국어(번역 방송)')o.lang='다국어(통역시스템)';((SCHEMAS[k]||{}).fields||[]).forEach(f=>{if((f.t==='number'||f.t==='pct')&&o[f.k]!==undefined)o[f.k]=o[f.k]===''?'':+o[f.k];if(f.t==='check')o[f.k]=isT(o[f.k])});return o}
async function api(action,data={},url){
 let r,j;
 try{r=await fetch(url||CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:CFG.token,...data})})}
 catch(e){throw new Error('서버에 연결할 수 없습니다 (인터넷·서버 주소 확인)')}
 try{j=await r.json()}catch(e){throw new Error('서버 응답 오류 — 웹 앱 배포 설정(액세스: 모든 사용자)을 확인하세요')}
 if(!j.ok){const er=new Error(j.error||'서버 오류');er.auth=!!j.auth;throw er}
 return j;
}
function setSync(st,msg){const e=$('#sync');if(!e)return;const d=new Date();e.className='sync '+st;
 e.textContent=st==='ok'?`● 연동됨 ${pad(d.getHours())}:${pad(d.getMinutes())}`:st==='busy'?'● 동기화 중…':st==='err'?'● 연동 오류':'● 이 기기 저장';
 e.title=msg||(st==='off'?'서버 연동 안 함 — 설정에서 연결할 수 있습니다':'눌러서 지금 동기화')}
function renderUser(){
 const b=$('#userBox');if(!b)return;
 if(logged())b.innerHTML=`👤 <b>${esc(CFG.name||CFG.id)}</b><span class="mut" style="font-size:12px">${esc(CFG.title?CFG.title+' · ':'')}${ROLE_TXT[CFG.role]||''}</span><button class="btn sm" onclick="logout()">로그아웃</button>`;
 else if(online())b.innerHTML=`<button class="btn sm primary" onclick="lockApp()">로그인</button>`;
 else b.innerHTML=`👤<select id="roleSel" onchange="setRole(this.value)">${['대표이사','안전팀장','안전관리자'].map(o=>`<option ${o===DB.settings.role?'selected':''}>${o}</option>`).join('')}</select><button class="btn sm" onclick="CFG.localOK=false;saveCfg();lockApp()">서버 로그인</button>`;
}
const ADMK=['sites','notices','goals'];  /* 현장·공지는 관리자만 등록·수정 */
function applyRole(){document.body.classList.toggle('ro',!canEdit());document.body.classList.toggle('notadm',online()&&!isAdmin());renderUser()}
function authFail(msg){CFG.token='';saveCfg();setSync('err',msg);lockApp(msg)}
async function pull(){
 if(!logged()||PULLING)return;PULLING=true;setSync('busy');
 try{
  const j=await api('all');Object.assign(CFG,{name:j.user.name,title:j.user.title,role:j.user.role});saveCfg();
  const d=j.data||{},empty=COLL_KEYS.every(k=>!(d[k]||[]).length);
  if(FIRST_CONNECT&&empty&&canEdit()&&LOCALSNAP&&LOCALSNAP.sites.length){
   FIRST_CONNECT=false;
   if(confirm(`서버에 아직 자료가 없습니다.\n이 PC에 있던 자료(현장 ${LOCALSNAP.sites.length}개, 위험요인 ${LOCALSNAP.hazards.length}건 등)를 서버에 올릴까요?\n\n※ 예시 자료라서 올리지 않으려면 [취소] → 설정에서 실제 현장부터 등록하세요.`)){
    COLL_KEYS.forEach(k=>DB[k]=LOCALSNAP[k]||[]);PULLING=false;pushAll();return;}
  }
  FIRST_CONNECT=false;
  COLL_KEYS.forEach(k=>DB[k]=(d[k]||[]).map(r=>normalize(k,r)));VER=j.ver;save();setSync('ok');applyRole();render();
  if(isAdmin())api('users').then(u=>{const n=u.users.filter(x=>x.status==='대기').length;if(n!==PENDING){PENDING=n;nav();if(n)toast(`👥 승인 대기 회원 ${n}명 — 「회원 관리」에서 승인하세요`)}}).catch(()=>{});
 }catch(e){if(e.auth)authFail(e.message);else setSync('err',e.message)}
 finally{PULLING=false}
}
async function commit(key,rec){
 save();render();if(!online())return;setSync('busy');
 try{const j=await api('save',{coll:key,rec});const i=DB[key].findIndex(x=>x.id===rec.id);if(i>=0)DB[key][i]=normalize(key,j.rec);const stale=j.prev!==VER;VER=j.ver;save();setSync('ok');if(stale)pull();else render()}
 catch(e){if(e.auth)return authFail(e.message);setSync('err',e.message);alert('⚠ 서버 저장 실패: '+e.message+'\n이 기기 화면에만 반영되었습니다. 인터넷 확인 후 다시 저장해 주세요.')}
}
function armDelete(b,go){
 if(b.dataset.arm){go();return}
 b.dataset.arm='1';b.textContent='⚠ 한 번 더 누르면 삭제';b.style.background='#dc2626';b.style.borderColor='#dc2626';
 setTimeout(()=>{if(b.isConnected&&b.dataset.arm){delete b.dataset.arm;b.textContent='삭제';b.style.background='';b.style.borderColor=''}},4000);
}
let TOAST_T;
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}
 t.textContent=msg;t.className='on';clearTimeout(TOAST_T);TOAST_T=setTimeout(()=>t.className='',2200)}
window.addEventListener('storage',e=>{if(e.key!==LS||!e.newValue)return;try{DB=JSON.parse(e.newValue);load2();render();toast('🔄 다른 창에서 바뀐 내용을 반영했습니다')}catch(_){}});
async function remove(key,id){
 DB[key]=DB[key].filter(x=>x.id!==id);save();closeModal();render();if(!online())return;setSync('busy');
 try{const j=await api('del',{coll:key,id});const stale=j.prev!==VER;VER=j.ver;setSync('ok');if(stale)pull()}
 catch(e){setSync('err',e.message);alert('⚠ 서버 삭제 실패: '+e.message)}
}
async function pushAll(){
 setSync('busy');
 try{await api('bulk',{data:Object.fromEntries(COLL_KEYS.map(k=>[k,DB[k]]))});VER='';await pull();alert('서버에 올렸습니다. 다른 관리자 화면에도 곧 반영됩니다.')}
 catch(e){setSync('err',e.message);alert('⚠ 서버 업로드 실패: '+e.message)}
}
function replaceAll(){save();render();if(online())pushAll()}
function manualSync(){if(logged())pull();else if(online())lockApp();else render()}

async function loadMembers(){

 const L=MEMBERS.slice().sort((a,b)=>(a.status==='대기'?0:1)-(b.status==='대기'?0:1)||String(a.joined).localeCompare(String(b.joined)));

:\"철근 하역시 신호방법 불량으로 인하여 근로자 낙하/비래사고 발생위험\",\"a\":\"하역 양중작업시 작업구획을 명확히 설정 하여 주변근로자 출입금지 조치를 실시 한다.\\n철근 하역장은 사전에 검토 하여 근로자 이동이 적은 충분한 공간을 확보 하여 양중한다.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"철근 양중 작업시 단철물 고정 불량으로 인한 낙하물 발생 위험\",\"a\":\"철근 단척물의 경우 양중함(인양함)을 사용하여야 하며, 양중함의 2/3이상을 적재 하지 아니하여야 하고, 양중물의 낙하 위험이 있을 경우 별도의 덮개를 설치하여 양중 하여야 한다.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"철근자재 양중작업시 부재의 길이가 상이한 자재 양중시 철근 낙하위험\",\"a\":\"철근 양중시 장철물 단철물은 동시에 인양 하는걸 지양 하고 부득이한 경우 부재에 슬링밸트가 견고하게 고정 했는지 사전에 확인 조치 후 이양작업을 실시 한다.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"철근 장철물 양중 작업시 고정 불량으로 인한 낙하물 발생 위험\",\"a\":\"철근 장척물의 경우 2줄걸이를 원칙으로 하며, 반드시 1개 이상의 슬링에 감겨 있어야 하고, 전체 길이의 1/4 지점에 슬링을 체결하여 휘지 않도록 균형을 잡아 양중을 하여야 한다. 필요시, 철선등을 활용하여 고정을 보강하여야 한다.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"철근배근 작업시 슬라브 상부에 과도한 철근적재로 인하여 슬라브 붕괴사고 발생위험\",\"a\":\"철근 슬라브 적재시 과도한 집중 하중이 발생하지 않도록 철근을 분산하여 적재 할 것\\n철근 적재시 하중을 고려 하여 과도한 자재를 적재 하지 않도록 관리 할 것\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"계단실 철근 배근 작업시 발판 미 확보로 인한 전도 및 추락 위험\",\"a\":\"계단실 철근 배근 작업시 작업발판 및 안전난간대를 확보하여 작업을 진행 하여야 하며, 벽체 철근 배근을 위해 말비계(우마) 사용시 1.2m 이내(폭40cm)를 사용하여 전도 사고를 방지 할 것.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"철근 운반시 1인 단독 작업으로 인한 전도 및 근골격계 질환 위험\",\"a\":\"철근 운반시 2인 1개조 작업을 실시하며, 장갑등 보호구를 착용하여 찰상등의 사고를 방지 할 것.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"이음 철근 찔림으로 인한 찰상, 출혈의 위험\",\"a\":\"이음 철근의 경우 철근캡을 설치하여 찔림 및 베임에 의한 사고를 방지. 혹은, 경고표지(위험표시) 및 접근통제를 통해 주변 근로자의 부상을 방지 할 것.\"}]},\"크레인양중\":{\"c\":\"A1000042\",\"i\":[{\"g\":\"중\",\"d\":\"안전\",\"h\":\"크레인 작업반경내 고압선 근접및 접촉에 의한 감전\",\"a\":\"작업반경내 장애물 여부 점검 및 신호수 배치하여 접근 금지 조치\"},{\"g\":\"고\",\"d\":\"안전\",\"h\":\"인양용 줄걸이 와이어로프 불량 및 2 줄걸이 미체결로 인한 파단 , 낙하\",\"a\":\"줄거리용 와이어로프 사전 점검 및 주기적 점검 교체\\n양중시 2줄걸이 사용\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"유도로프 미사용으로 양중물 낙하 위험 및 하역자재 하부 진입으로 인한 협착\",\"a\":\"유도로프 사용\\n하역근로자 양중물 하부 진입금지 신호수 교육 실시.\"},{\"g\":\"고\",\"d\":\"안전\",\"h\":\"아웃트리거 셋팅 불량 및 연약지반 침하로 장비 전도\",\"a\":\"아웃트리거 펼침 상태 및 받침목 설치후 작업진행\\n평탄한 지반에 거치 상태 점검,\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"장비 운전원과 신호수 사이 신호체계 불량으로 인한 사고 위험\",\"a\":\"운전원 및 신호수 무전기 지급하며, 호출부호 부여\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"장비 작업반경내 관계자 외 출입통제 불량으로 타공종 근로자 협착\",\"a\":\"장비설치 구간 접근방지용 라바콘 또는 위험테이프 설치\"},{\"g\":\"고\",\"d\":\"안전\",\"h\":\"중량물을 인양시 장비능력 및 줄걸이 제원등을 고려하지 않아 전도 및 와이어 파단\",\"a\":\"장비 작업 계획서 작성  및  양중능력에 맞는 장비 줄걸이 선정.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"자재 적재시 고임 상태 불량으로 인한 자재 전도\",\"a\":\"자재 하역시 수평상태 고려하여 받침목 및 지지대 설치하여 전도 방지 시설 설치\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"후크해지장치, 권과방지장치, 크레인 와이어 등 안전장치 불량인한 낙하물 발생\",\"a\":\"양중기 (이동식 크레인 ) Check list  통한 사전 점검\"},{\"g\":\"고\",\"d\":\"안전\",\"h\":\"자재 인양시 여러 부재를 동시에 인양함에 따른 낙하\",\"a\":\"동일자재를 결속하여 인양 및 단소자재는 인양함 사용\\n신호수 교육 실시\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"샤클 불량 및 변형된 샤클 사용으로 샤클이 파단되어 양중물 낙하\",\"a\":\"샤클 정품사용 및 변형여부, 이상유무 등을 사용전 확인 후 사용한다.\"}]},\"먹메김\":{\"c\":\"A1000043\",\"i\":[{\"g\":\"저\",\"d\":\"안전\",\"h\":\"돌출된 스라브 앙카로 인한 전도 위험\",\"a\":\"1.작업전 개구부덮게 및 난간대 설치상태 확인 2.작업중 수시로 E/V 및 집수정 위치 확인\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"스라브 단부를 인식하지 못하여 낙하 위험\",\"a\":\"스라브 단부를 인식하지 못하여 낙하 위험\"},{\"g\":\"고\",\"d\":\"안전\",\"h\":\"작업장으로 이동중 장비와 협착 위험\",\"a\":\"1.작업전 개구부 주위 라바콘 설치 2.작업중 수시로 E/V 및 집수정 위치 확인\"},{\"g\":\"고\",\"d\":\"안전\",\"h\":\"E/V Pit 및 집수정Pit을 인식하지 못하여 작업중 추락 위험\",\"a\":\"지정통로 이용하여 이동\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"돌출된 철근으로 인한 찔림 위험\",\"a\":\"작업전 또는 작업중  위치 확인/철근찔림방지커버설치\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"자재인양구,E/V등 개구부로 인한 추락 위험\",\"a\":\"작업전 스라브 단부위치,안전난간대 설치상태등을 확인후 작업\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"스라브 단부를 인식하지 못하여 작업중 추락 위험\",\"a\":\"돌출된 철근를 위험테이프로 표시하고 작업진행\"},{\"g\":\"저\",\"d\":\"안전\",\"h\":\"먹매김 작업시 허리를 숙이거나 쪼그려 앉는 등 부자연스러운 자세로 작업으로 인한 근골격계 질환 위험\",\"a\":\"1. 휴식시간 부여(50분작업 10분휴식) 및 스트레칭 실시\\n2. 작업방향 변경 등 고정된 작업자세를 수시로 변경(반복작업 최소화)\"},{\"g\":\"저\",\"d\":\"안전\",\"h\":\"콘크리트 접촉에 의한 알러지 및 접촉화상\",\"a\":\"안전장화 및 장갑 착용\\n콘크리트 접촉 알레르기 유무 사전 문답확인\"},{\"g\":\"중\",\"d\":\"보건\",\"h\":\"여름철 작업중 무더운 날씨로 인한 근로자 일사병, 열사병 위험\",\"a\":\"그늘진 곳에서 작업 간 충분한 휴식을 취하고, 적절한 수분, 식염 섭취\\n폭염주의보, 폭염 경보시 시간당 10~20분 휴식을 취하며 전체 작업자 보냉제품 지급\"}]},\"거푸집 설치\":{\"c\":\"A1000044\",\"i\":[{\"g\":\"중\",\"d\":\"안전\",\"h\":\"망치 등 공도구 사용 중 공도구에 의한 맞음 위험\",\"a\":\"공도구 상태 점검, 보호장갑 착용 및 작업 시 주의\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"각재 및 판재를 절단하는 작업시 목재분진 비산으로 인한 호흡기계 질환 발생 위험\",\"a\":\"올바른 방진마스크 착업방법 교육 및 작업시 방진마스크, 보안경을 착용\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"\\\"합벽 구간 일체형 솔저 연장 작업을 위해 준비 작업 중 틈사이로 발이 빠지며\\n추락 위험\\\"\",\"a\":\"\\\"작업 발판을 설치하도록 하며, 2m 이상 고소작업시에는 안전고리 체결 시설을 설치하여\\n안전고리 체결 후 작업하도록 관리\\\"\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"거푸집 작업시 옆면 유로폼 미 부착상태에서 인력을 이용하여 보를 설치하다 상부에서 근로자 추락의 위험\",\"a\":\"거푸집 작업시 옆면 유로폼 보를 제작하여 타위 및 크레인을 이용하여 설치관리 할 것\"},{\"g\":\"고\",\"d\":\"안전\",\"h\":\"이동식 틀비계 사용시 안전난간대 해체로 인한 근로자 추락의 위험\",\"a\":\"이동식 틀비계 아웃트리거 및 안전난간대 설치 상태 확인 후 작업 실시\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"보 거푸집 상부 공간이 넓은 구간 발판이 설치되어 있지 않아 근로자 이동 중 전도의 위험\",\"a\":\"보 상부 건널목에 발판설치 및 고정하여 관리 실시\"},{\"g\":\"저\",\"d\":\"안전\",\"h\":\"못이 제거 되지 않은 자재를 이용하여 거푸집 작업을 진행하다가 근로자 재해의 위험\",\"a\":\"자재를 재사용하기전에 자재에 못을 사전제거 하고 작업을 실시 할 것\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"자재에 박힌 못을 제거 하다가 보안경 미 착용으로 인한 근로자 안구의 손상 위험\",\"a\":\"못제거 작업시 보안경 착용하여 작업을 실시 하도록 관리 할 것\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"목재 절단용 이동용 둥근톱(스킬) 사용 후 바닥에 내려두어 이동하는 근로자가 베일 위험이 있음\",\"a\":\"이동식 둥근톱(스킬) 다이를 제작하여 다이위에 보관하여 관리\"},{\"g\":\"고\",\"d\":\"안전\",\"h\":\"보거푸집 설치 작업시 근로자 이동으로 인한 추락사고 발생위험\",\"a\":\"보설치작업시 설치전 생명로프를 선설치 하여 근로자 이동시 안전밸트 고리를 체결 할 수 있는 안전조치를 사전에 실시 한다.\\n보 설치시 사전에 보브라켓등 안전조치를 사전에 실시 하여 근로자 추락사고를 미연에 예방 한다.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"보 거푸집 설치 후 인양용 슬링밸트 해체시 근로자 추락사고 발생위험\",\"a\":\"보 거푸집 인양용 슬링밸트는 상부에서 해체는 지양하고 하부에서 해체 할 수 있도록 사전 조치 한다.\\n인양용 슬링밸트를 2점 연결 하여 하부에서 슬링밸트 샤클을 해체하여 추락사고를 미연에 예방 조치 한다.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"거푸집 보 설치작업 중 생명줄을 매듭지어 이어서 설치함으로 인하여 매듭부위 풀림으로 인한 근로자 추락의 위험\",\"a\":\"생명줄 설치시에는 매듭으로 이어서 설치하지 않도록 관리 할 것\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"보 거푸집 제작,설치시 지면에서 측판 거푸집 미설치 상태 인양으로 인한 측판 설치 작업중 추락위험\",\"a\":\"보 거푸집 제작시 지면에서 측판설치 후 인양 설치 확인\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"거푸집 설치 작업시 작업발판 불량으로 인한 추락 및 전도의 위험\",\"a\":\"거푸집 설치 작업시 작업발판의 사용의 경우 말비계는 높이 1.2m 이내, 발판 폭 40cm 이상 확보 하여야 하며, 이동식비계의 경우 난간대를 견고하게 설치하고, 하부 지면에서 상부 작업발판으로의 이동을 위한 승강사다리(내부로 이동할 수 있도록 이동구간에 해치발판 설치)를 설치되어야 하며, 발판의 틈새는 3cm 이하로 유지 될수 있도록 밀착되게 설치 하고, 아웃트리거를 4면에 설치하여 전도 방지 조치를 하여야 한다.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"슬라브 거푸집 작업시 이동통로 미 확보 및 작업 구간 협소로 인한 추락의 위험\",\"a\":\"거푸집 슬라브 작업의 경우 이동 통로 및 작업 공간 확보를 위하여, 계단실 작업을 먼저 실시하고, 계단실을 기준으로 슬라브 작업을 진행/확대하는 순서로 진행 할 것.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"벽체 거푸집 설치 작업시 전도 방지 조치 미흡으로 인한 붕괴 위험\",\"a\":\"벽체 거푸집 설치시 버팀대(각재)를 설치하며, 버팀 하부는 쐐기못으로 고정하여 밀리거나, 이탈하지 않도록 고정 할 것.\"},{\"g\":\"고\",\"d\":\"안전\",\"h\":\"거푸집 동바리(강관동바리) 사용 높이 초과로 인한 변형, 붕괴 위험\",\"a\":\"동바리의 사용 높이는 V1 = 최고 3300~ 최저1800, V2 = 최고3500~최저2000, V3 = 최고3900~최저2400, V4 = 최고4200~최저2700, V5 = 최고5000~최저3000, V6 = 최고6000~최저4000 으로 사용하여야 하며, 높이 3.5m 초과시 2m 이내마다 양방향 수평연결재를 설치하여야 한다. 이때, 전용철물(직교클램프)를 사용하여야 하며, 철선(반생)은 사용을 금지한다.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"계단실 동바리 설치시 이중 동바리로 인한 붕괴 위험\",\"a\":\"계단실의 계단참 부분은 동바리 하부에 공시체를 이용하여 지지하고, 장선의 최대간격은 200mm이내로 하여 상/하부 서포트의 편심을 100mm이내로 시공관리하여야 하며, 경가계단 외측 부분에 동바리가 유로폼 앵글에 지지되는 경우에는 앵글 하부에 받침목을 추가하여 서포트의 탈락을 방지하여야 한다. 서포트 하부 받침목은 철선으로 유로폼에 긴결하여 고정할것.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"층고가 높은 계단실의 동바리 시공 불량으로 인한 붕괴 위험\",\"a\":\"층고가 높은 계단실 구간의 상부서포트는 하부 멍에의 상부에 설치하여 상/하부 서포트의 편심거리 최대 200mm 이내로 시공관리하여야 하며, 경사계단 내측 부분은 서포트 하부와 경사 받침목 사이에 쐐기목을 추가하여 하부를 고정(못2개소) 하여야 한다.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"계단참 단차 구간 하부 서포트 시공 불량으로 인한 붕괴 위험\",\"a\":\"계단참 단차 구간의 서포트 시공의 경우 상부슬래브 직하부에 서포트를 직접 설치하는 방법. 혹은, 장선하부에 받침목을 각방향으로 300mm간격 이내로 설치(이때, 받침목 위치가 하부 장선에 벗어나지 않도록 설치) 하는 방법 두가지중 한가지를 선택하여 시공 관리를 하여야 한다.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"경사 슬래브 하부 서포트 시공 불량으로 인한 붕괴 위험\",\"a\":\"계단실, 램프등의 경사 슬래브 하부에 서포트를 설치할 경우 수직재에 발생하는 휨 모멘트를 최소화하기 위해서 서포트를 수직으로 설치하여야 하며, 서포트 상부는 쐐기목 혹은 전용철물을 설치해서 상부 타설하중이 서포트로 직접 전달될 수 있도록 하여야 한다. 단, 목재로 된 고임재를 설치할 경우에는 반드시 못(2개이상)으로 고정하여야 한다. 또한, 서포트 높이가 3.5m 최고활 경우에는 2m 이내마다 양방향으로 수평 연결재를 설치하여야 한다. 계단 슬라브 하부 장선(각목 84*84)의 최대 간격은 400mm, 멍에(각목 84*84)의 최대간격은 1,000mm이내로 설치하여야 한다.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"슬라브 타설전 거푸집 상부에 자재 야적시 하중 한도 초과로 인한 붕괴 위험\",\"a\":\"슬라브 두께별 거푸집 상부 최대 적재 높이를 다음과 같이 관리하여야 한다. 슬라브두께 150의 경우 거푸집(유로폼)의 경우 최대 18단, 철근은 0.6단. 슬라브두께 180의 경우 거푸집(유로폼)의 경우 최대 21단, 철근은 0.7단. 슬라브두께 200의 경우 거푸집(유로폼)의 경우 최대 23단, 철근은 0.8단.\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"거푸집 보 양중 작업시 흔들림으로 인한 상부 근로자 추락의 위험\",\"a\":\"거푸집 보 설치 작업을 안전하게 진행하기 위한 작업공간 확보(필요시 이동식비계 사용) 하고, 안전대 걸이시설을 설치(PP로프 사용시 16mm 이상)하여 근로자 추락사고를 방지하기 위한 관리를 할 것.\"}]},\"기초거푸집설치\":{\"c\":\"A1000045\",\"i\":[{\"g\":\"중\",\"d\":\"안전\",\"h\":\"거푸집설치시 상부돌출철근에 의해찔림 위험\",\"a\":\"작업전 철근보호캡및천막보양후 작업\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"용접작업시 용접열기로 인하여 안면 화상위험\",\"a\":\"보안면착용후 작업실시\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"작업장으로 이동시 건설장비와 협착 위험\",\"a\":\"지정된 통로 및 신호수 통제에 따리 이동\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"콘크리트 못 설치시 못이 튀어 안구 손상 위험\",\"a\":\"보안경(면) 착용 후 작업\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"E/V,집수정Pit등 개구부 개방에 따른 전도 위험\",\"a\":\"개구부 인식용 위험 테이프 설치\"},{\"g\":\"중\",\"d\":\"보건\",\"h\":\"무더위로 인한 근로자 열사병 및 심질환 위험\",\"a\":\"작업전후 수분,식염 섭취 및 적절한 휴식시간 부여\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"유로폼(600*1200)을 운반, 조립 작업시 불안전한 작업자세 및 단독 작업으로 인한 허리, 어깨, 무릎 등 근골격계질환 발생위험\",\"a\":\"중량물 취급시 이동거리 최소화로 부담작업 시간단축\\n휴식시간 부여 및 스트레칭 실시\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"각재 및 판재를 절단하는 작업시 목재분진이 비산으로 인한 호흡기계 질환 발생 위험\",\"a\":\"올바른 방진마스크 착업방법 교육 및 작업시 방진마스크 착용\"}]},\"타설\":{\"c\":\"A1000046\",\"i\":[{\"g\":\"중\",\"d\":\"안전\",\"h\":\"타설 작업시 콘크리트 분진에 의한 근로자 호흡기계 질환 위험\",\"a\":\"방진마스크 올바른 착용법 교육후 방진마스크, 귀마개를 착용 후 작업\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"기초타설시 CON'C 비산에 의한 안구손상위험\",\"a\":\"바이브레터및자바라공은 보안경 착용후 작업\"},{\"g\":\"고\",\"d\":\"안전\",\"h\":\"레미콘 트럭 후진시 장비 및 근로자 협착사고위험\",\"a\":\"펌프카 주변 라바콘 설치및 스토퍼설치,신호수배치(신호수:직영팀)\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"타설시 CON'C가 비산되어 안구 손상 위험\",\"a\":\"CON'C 타설공은 보안경(면) 착용 후 작업\"},{\"g\":\"중\",\"d\":\"안전\",\"h\":\"CON'C다짐기 사용시 피복이 손상되어 감전되는 위험\",\"a\":\"CON'C담짐기 전선 피복상태 점검 후 작업\"},{\"g\":\"고\",\"d\":\"안전\",\"h\":\"레미콘 트럭 후진시 장비 협착 위험\",\"a\":\"펌프카 주변 위험테이프,스토퍼 설치 및 신 :'저','3':'고','2':'중','1':'저'};\n\n/* ================= 상태 ================= */\nfunction ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}\nfunction weekRange(){const t=new Date();const dw=t.getDay();const mon=new Date(t);mon.setDate(t.getDate()-((dw+6)%7));const sat=new Date(mon);sat.setDate(mon.getDate()+5);return [ymd(mon),ymd(sat)];}\n/* 기본정보 기본값 : 비어 있음. [내 기본값으로 저장]을 누르면 그 값이 새 문서의 기본값이 됨 */\nconst HKEY='gsRiskDefH';\nconst BLANK_H={kind:'수시',prjCd:'',prjNm:'',bizDeptCd:'',ptncoNm:'',ptncoCd:'',wktpNm:'',wktpCd:'',sd:'',ed:'',writer:'',leader:'',sup:'',picId:'',mtgYmd:'',cat:'추가입력 (현장별 입력)'};\nconst OLD_DEF={prjCd:'250230',prjNm:'수지자이에디시온(경기)',bizDeptCd:'0001',ptncoNm:'여명건영',ptncoCd:'16374',wktpNm:'철근콘크리트공사(건축/주택)',wktpCd:'3030',writer:'이윤규',leader:'박종남',sup:'한필구',picId:'pghan3'};\nfunction defH(){const w=weekRange();let my={};try{my=JSON.parse(localStorage.getItem(HKEY))||{};}catch(e){}\n  const o=Object.assign({},BLANK_H,my,{mtgYmd:''});const r=kindRange(o.kind||'수시');o.sd=r[0];o.ed=r[1];return o;}\n/* 평가구분별 기본 기간 : 수시=이번 주(월~토) / 정기=올해 1.1~12.31 / 최초=오늘부터 1년 */\nconst KINDS={'수시':{lbl:'작업일자',desc:'작업 시작일 ~ 종료일'},'정기':{lbl:'평가기간',desc:'정기평가 적용기간 (기본: 올해 1년)'},'최초':{lbl:'적용기간',desc:'최초평가일 ~ 적용 종료일 (기본: 1년)'}};\nfunction kindRange(k){const t=new Date();\n  if(k==='정기')return [t.getFullYear()+'-01-01',t.getFullYear()+'-12-31'];\n  if(k==='최초'){const e=new Date(t);e.setFullYear(t.getFullYear()+1);e.setDate(e.getDate()-1);return [ymd(t),ymd(e)];}\n  return weekRange();}\nfunction setKind(k,silent){\n  if(!KINDS[k])k='수시';const changed=H.kind!==k;H.kind=k;\n  if(changed&&!silent){const r=kindRange(k);H.sd=r[0];H.ed=r[1];rows.forEach(x=>{x.sd=H.sd;x.ed=H.ed;});fillHeader();render();touch();\n    toast(k+' 위험성평가로 변경 · '+KINDS[k].lbl+' '+dot(H.sd)+' ~ '+dot(H.ed)+' 전체 적용');}\n  showKind();}\nfunction showKind(){const k=H.kind||'수시';\n  document.querySelectorAll('.kind-seg button').forEach(b=>b.classList '):'';}\nfunction clean(s){return String(s||'').replace(/\\*\\*/g,'').replace(/\\r/g,'').replace(/\\n{2,}/g,'\\n').trim();}\n\n/* 2차원 배열 → 행 데이터. GS 양식(위험요인/대책방안)과 예전 물류 양식(유해·위험요인) 모두 인식 */\nfunction gridToRows(grid,forceAct){\n  const T=c=>cellText(c).replace(/\\s/g,'');\n  const hi=grid.findIndex(r=>(r||[]).some(c=>{const t=T(c);return t==='위험요인'||t.includes('유해')||t==='dgrskGrdCd'||(t.includes('위험요인')&&t.length<=12);}));\n  if(hi<0)throw new Error('머리글에서 「위험요인」 칸을 찾지 못했습니다.');\n  const top=hi>0?grid[hi-1]:[];\n  let lab=grid[hi].map((c,i)=>(T(c)||T(top[i])));\n  const labTop=grid[hi].map((c,i)=>T(top[i]));\n  /* 머리글이 2줄(예: 위험성 → 가능성·중대성·위험성)인 양식 */\n  const nx=(grid[hi+1]||[]).map(T);let start=hi+1;\n  if(nx.filter(t=>/^(빈도|가능성|중대성|강도|위험성|위험도|대분류|소분류|시작일|종료일|개선전|개선후|현재|감소대책|대책)/.test(t)).length>=2){lab=lab.map((x,i)=>nx[i]&&nx[i]!==x?(/^(개선후|개선전)$/.test(nx[i])?x+nx[i]:nx[i]):x);start=hi+2;}\n  const find=(...ks)=>{for(const k of ks){const i=lab.findIndex(x=>x===k);if(i>=0)return i;}for(const k of ks){const i=lab.findIndex(x=>x.includes(k));if(i>=0)return i;}return -1;};\n  const findTop=k=>labTop.findIndex(x=>x.includes(k));\n  const ix={\n    B:find('협력사명/공종'),cat:find('대분류'),sub:find('소분류'),grade:find('위험도','등급'),div:find('구분'),\n    hz:find('위험요인','유해·위험요인','유해위험요인','유해'),act:-1,now:find('현재안전보건조치','현재의안전보건조치','현재'),\n    sd:find('시작일'),ed:find('종료일'),K:findTop('작성자/')>=0?findTop('작성자/'):find('작성자/작업팀장(협력사)'),L:find('시공담당'),\n    seq:find('rskasmSeq'),mtg:find('mtgYmd'),wr:find('wrtrNm'),ld:find('jobTmldrNm'),pic:find('picId'),gc:find('dgrskGrdCd'),biz:find('bizDeptCd'),\n    code:find('unitJobCd'),uname:find('unitJobNm'),prj:find('prjCd'),pc:find('ptncoCd'),wc:find('ptncoWktpCd'),pn:find('ptncoNm'),wn:find('ptncoWktpNm'),\n    proc:find('세부작업','세부공정','단위작업','작업명','세부분류','공정'),f:find('빈도','가능성'),s:find('강도','중대성')\n  };\n  if(ix.div===ix.cat)ix.div=-1;\n  if(ix.grade<0)ix.grade=lab.findIndex(x=>/^(위험성|위험성크기|위험성수준|위험성결정|개선전위험성|위험성\\(개선전\\))$/.test(x));\n  { /* Ymd:normDate(g(r,'mtg'))});\n  });\n  return {rows:out,meta,labs:lab.filter((x,i)=>x&&i!==ix.hz)};\n}\nfunction parseCSV(t){\n  const rows=[];let row=[],f='',q=false;\n  for(let i=0;i<t.length;i++){const c=t[i];\n    if(q){if(c==='\"'){if(t[i+1]==='\"'){f+='\"';i++;}else q=false;}else f+=c;}\n    else if(c==='\"')q=true;else if(c===','){row.push(f);f='';}\n    else if(c==='\\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\\r')f+=c;}\n  if(f!==''||row.length){row.push(f);rows.push(row);}return rows;\n}\nfunction decodeText(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^﻿/,'');}catch(e){return new TextDecoder('euc-kr').decode(buf);}}\nasync function fileToGrids(file){\n  const buf=await file.arrayBuffer(),ext=file.name.split('.').pop().toLowerCase();\n  if(ext==='csv'||ext==='txt')return [parseCSV(decodeText(buf))];\n  if(ext==='json'){let j;try{j=JSON.parse(decodeText(buf));}catch(e){throw new Error('JSON 형식이 올바르지 않습니다.');}return {json:j};}\n  if(ext==='xls')throw new Error('.xls(구버전)은 엑셀에서 .xlsx로 다시 저장한 뒤 넣어주세요.');\n  const EJ=await loadExcelJS();const wb=new EJ.Workbook();await wb.xlsx.load(buf);\n  const grids=[];\n  wb.eachSheet(ws=>{\n    const g=[];const mc=ws.columnCount;\n    // 병합셀: 대표 셀 값으로 채움\n    ws.eachRow({includeEmpty:true},(row,rn)=>{const arr=[];for(let c=1;c<=mc;c++){const cell=row.getCell(c);let v=cell.value;\n      if(cell.isMerged&&cell.master&&cell.master!==cell)v=cell.master.value;arr.push(v);}g[rn-1]=arr;});\n    for(let i=0;i<g.length;i++)if(!g[i])g[i]=[];\n    grids.push(g);});\n  return grids;\n}\nfunction pickFile(accept){return new Promise(ok=>{const inp=document.createElement('input');inp.type='file';inp.accept=accept;inp.onchange=()=>ok(inp.files[0]);inp.click();});}\n\n/* 엑셀 불러오기 → 표 */\nasync function importXLSX(){\n  const file=await pickFile('.xlsx,.csv,.json,.txt');if(!file)return;\n  try{\n    toast('불러오는 중…');\n    const grids=await fileToGrids(file);\n    let all=[],meta={};\n    if(grids.json){\n      const j=grids.json;\n      // 이 프로그램에서 저장한 평가표 JSON → 그대로 열기\n      if(j&&!Array.isArray(j)&&Array.isArray(j.rows)&&j.H){\n        if(rows.length&&!confirm('지금 표를 이 JSON 파일('+j.rows.length+'건)로 바꿀까요?'))return;\n        loadSnap(j);touch();toast(j.rows.length+'건 불러왔습니다');return;}\n      const P=askAct(parseItems(grids),grids);all=P.items.map(it=>({cat:it.cat,sub:it.sub,code:it.code,grade:it.grade,div:it.div,hz:it.hz,act:it.act}));\n    }else{const P=askAct(parseItems(grids),grids);all=P.items;meta=P.meta;}\n    /* 「공종 - 세부작업」 이름 → 대분류 / 소분류 */\n    all.forEach(o=>{if(!o.cat){const m=String(o.sub||'').match(/^(.+?)\\s+[-–]\\s+(.+)$/);if(m){o.cat=m[1].trim();o.sub=m[2].trim();}}});\n    if(!all.length)throw new Error('불러올 항목을 찾지 못했습니다. 머리글에 「위험요인」 칸이 있는지 확인하세요.');\n    const mode=rows.length?(confirm(all.length+'건을 찾았습니다.\\n\\n[확인] 기존 표를 지우고 이 파일로 교체\\n[취소] 기존 표 뒤에 추가')?'new':'add'):'new';\n    if(mode==='new'){rows=[];sel.clear();\n      const f=all[0];if(f.ptnco||f.writer)Object.assign(H,{ptncoNm:f.ptnco||H.ptncoNm,wktpNm:f.wktp||H.wktpNm,ptncoCd:f.pc||H.ptncoCd,wktpCd:f.wc||H.wktpCd,\n        writer:f.writer||H.writer,leader:f.leader||H.leader,sup:f.sup||H.sup,sd:f.sd||H.sd,ed:f.ed||H.ed,cat:f.cat||H.cat});\n      ['prjCd','bizDeptCd','picId','mtgYmd'].forEach(k=>{if(meta[k])H[k]=meta[k];});fillHeader();}\n    all.forEach(o=>rows.push(newRow(Object.assign({},o,{\n      ptnco:o.ptnco||H.ptncoNm,wktp:o.wktp||H.wktpNm,pc:o.pc||H.ptncoCd,wc:o.wc||H.wktpCd,cat:o.cat||H.cat,\n      sd:o.sd||H.sd,ed:o.ed||H.ed,writer:o.writer||H.writer,leader:o.leader||H.leader,sup:o.sup||H.sup}))));\n    render();touch();toast(all.length+'건 불러왔습니다');\n  }catch(e){alert('불러오기 실패 : '+e.message);}\n}\n\n/* 파일 → 항목 (대책방안 칸을 못 찾으면 사용자에게 칸을 고르게 함) */\nfunction parseItems(grids,force){\n  let items=[],meta={},cols=[];\n  if(grids.json){JR_KEYS=new Set();items=jsonToRows(grids.json,force);cols=[...JR_KEYS];}\n  else grids.forEach(gd=>{try{const r=gridToRows(gd,force);items=items.concat(r.rows);if(!meta.prjCd)meta=r.meta;if(!cols.length)cols=r.labs;}catch(e){}});\n  return {items,meta,cols:[...new Set(cols)].filter(x=>x&&!/^(No\\.?|번호|순번)$/i.test(x))};\n}\nfunction askAct(P,grids){\n  if(!P.items.length||P.items.some(x=>String(x.act||'').trim())||!P.cols.length)return P;\n  const ans=prompt('위험요인 '+P.items.length+'건을 찾았지만 「대책방안(감소대책)」 칸을 찾지 못했습니다.\\n대책이 들어 있는 칸의 번호를 입력하세요. (없으면 취소)\\n\\n'+P.cols.map((c,i)=>(i+1)+'. '+c).join('\\n'),'');\n  const k=parseInt(ans,10);if(!(k>=1&&k<=P.cols.length))return P;\n  const Q=parseItems(grids,P.cols[k-1]);\n  if(!Q.items.some(x=>String(x.act||'').trim()))alert('「'+P.cols[k-1]+'」 칸에도 대책 내용이 없습니다.');\n  return Q.items.length?Q:P;\n}\n/* DB 가져오기 → 라이브러리 */\nlet JR_KEYS=new Set();\nfunction jsonToRows(j,force){\n  const out=[];\n  const pick=(o,re)=>Object.keys(o).find(k=>re.test(k.replace(/\\s/g,'')));\n  const walk=(node,ctx)=>{\n    if(node==null)return;\n    if(Array.isArray(node)){if(node.length&&Array.isArray(node[0])){try{const gr=gridToRows(node,force);gr.rows.forEach(r=>out.push(r));gr.labs.forEach(x=>JR_KEYS.add(x));return;}catch(e){}}node.forEach(x=>walk(x,ctx));return;}\n    if(typeof node!=='object')return;\n    // 이 프로그램 DB 형식 {c:코드, i:[{g,d,h,a}]}\n    if(Array.isArray(node.i)&&node.i.length&&node.i[0]&&typeof node.i[0]==='object'&&'h' in node.i[0]){\n      node.i.forEach(it=>{if(it&&it.h)out.push({sub:ctx||'★ 가져온 항목',grade:normG(it.g),div:/보건/.test(it.d)?'보건':'안전',hz:clean(it.h),act:clean(it.a),code:node.c||''});});return;}\n    const kH=pick(node,/위험요인|유해|hazard|^hz$|^h$/i);\n    const kP=pick(node,/소분류|단위작업|공정|공종|작업명|^sub$|^proc$|^name$|^n$|^work$/i);\n    const p=(kP&&typeof node[kP]==='string'&&node[kP].trim())?node[kP].trim():ctx;\n    if(kH&&typeof node[kH]==='string'){if(!node[kH].trim())return;\n      Object.keys(node).forEach(k=>{if(k!==kH)JR_KEYS.add(k);});\n      const kN0=pick(node,/현재|^now$/i),badK=k=>k===kH||k===kN0||/후위험|개선후|예정|일자|date|담당|owner/i.test(k);\n      const kA=force!=null?(force in node?force:null):(Object.keys(node).find(k=>!badK(k)&&/대책|감소|개선|조치|방안|예방|^act$|^a$|^m$|measure|action|control|mitigat|solution/i.test(k.replace(/\\s/g,'')))||null),kN=pick(node,/현재|^now$/i),kG=pick(node,/위험도|등급|grade|^g$/i),kD=pick(node,/구분|^d$|^div$/i);\n      const kF=pick(node,/빈도|가능성|^f$/i),kS=pick(node,/강도|중대성|^s$/i);\n      let grade=kG?String(node[kG]):'';if(!grade&&(kF||kS)){const x=(+node[kF]||1)*(+node[kS]||1);grade=x>=6?'고':(x>=3?'중':'저');}\n      const val=v=>v==null?'':Array.isArray(v)?v.map(val).filter(Boolean).join('\\n'):(typeof v==='object'?Object.values(v).map(val).filter(Boolean).join('\\n'):String(v));\n      let act=kA?val(node[kA]):'';if(kN&&node[kN])act=String(node[kN])+(act&&act!=='현행유지'?' / '+act:'');\n      const kCd=pick(node,/^code$|unitJobCd|단위작업코드/i);\n      out.push({sub:p||'★ 가져온 항목',grade:normG(grade),div:(kD&&/보건/.test(node[kD]))?'보건':'안전',hz:clean(node[kH]),act:clean(act),code:kCd?String(node[kCd]):''});return;}\n    Object.keys(node).forEach(k=>{const v=node[k];if(v&&typeof v==='object')walk(v,/^(items?|i|data|list|rows?|db|lib)$/i.test(k)?p:(p&&p!==ctx?p:k));});\n  };\n  walk(j,'');out.forEach(o=>o.sub=cleanSub(o.sub)||'★ 가져온 항목');return out;\n}\nasync function pickDB(){\n  const file=await pickFile('.xlsx,.csv,.json,.txt');if(!file)return;\n  try{\n    const grids=await fileToGrids(file);\n    const items=askAct(parseItems(grids),grids).items;\n    if(!items.length)throw new Error('가져올 항목을 찾지 못했습니다.');\n    const subs=[...new Set(items.map(i=>cleanSub(i.sub)||'★ 가져온 항목'))];\n    if(!confirm('단위작업 '+subs.length+'개, 항목 '+items.length+'건을 찾았습니다.\\nDB에 추가할까요? (같은 위험요인은 건너뜀)'))return;\n    const l=getLib();let add=0,skip=0;\n    items.forEach(it=>{const p=cleanSub(it.sub)||'★ 가져온 항목';l[p]=l[p]||{c:it.code||'',i:[]};if(!l[p].c&&it.code)l[p].c=it.code;\n      if(l[p].i.some(x=>(x.h||'').trim()===it.hz.trim())){skip++;return;}\n      l[p].i.push({g:it.grade,d:it.div,h:it.hz,a:it.act});add++;});\n    setLib(l);subs.forEach(s=>libOpen.add(s));alert('가져오기 완료 : '+add+'건 추가'+(skip?' / 중복 '+skip+'건 제외':''));openLib();\n  }catch(e){alert('가져오기 실패 : '+e.message);}\n}\n\n/* ================= 인쇄 ================= */\nfunction buildPrint(){\n  const list=rows;\n  const sB=spans(list,kB),sC=spans(list,kC),sD=spans(list,kD);\n  let body='';\n  list.forEach((r,i)=>{\n    body+='<tr><td class=\"c\">'+(i+1)+'<\/td>'+\n      (sB[i]?'<td class=\"pre\" rowspan=\"'+sB[i]+'\">'+h(j2(r.ptnco,r.wktp,'/\\n'))+'<\/td>':'')+\n      (sC[i]?'<td class=\"c\" rowspan=\"'+sC[i]+'\">'+h(r.cat)+'<\/td>':'')+\n      (sD[i]?'<td class=\"c\" rowspan=\"'+sD[i]+'\">'+h(r.sub)+'<\/td>':'')+\n      '<td class=\"c g-'+r.grade+'\">'+r.grade+'<\/td><td class=\"c\">'+h(r.div)+'<\/td>'+\n      '<td class=\"pre\">'+h(r.hz)+'<\/td><td class=\"pre\">'+h(r.act)+'<\/td>'+\n      '<td class=\"c nw\">'+dot(r.sd)+'<\/td><td class=\"c nw\">'+dot(r.ed)+'<\/td>'+\n      '<td class=\"c pre\">'+h(j2(r.writer,r.leader,'/\\n'))+'<\/td><td class=\"c nw\">'+h(r.sup)+'<\/td><\/tr>';\n  });\n  const c={고:0,중:0,저:0};list.forEach(r=>c[r.grade]++);\n  document.getElementById('printArea').innerHTML=\n    '<div class=\"p-title-wrap\"><div><\/div><div class=\"p-title\">'+h(document.getElementById('docTitle').textContent)+'<div class=\"p-kind\">[ '+h(H.kind||'수시')+' 위험성평가 ]<\/div><\/div><div class=\"p-appr\">'+\n      '<table class=\"approval\"><tr><th class=\"ap-side\" rowspan=\"2\">결<br><br>재<\/th><th class=\"ap-head\">담 당<\/th><th class=\"ap-head\">소 장<\/th><th class=\"ap-head\">대표이사<\/th><\/tr>'+\n      '<tr><td class=\"ap-sign\"><\/td><td class=\"ap-sign\"><\/td><td class=\"ap-sign\"><\/td><\/tr><\/table><\/div><\/div>'+\n    '<table class=\"p-info\"><tr><th>프로젝트<\/th><td>'+h((H.prjCd?H.prjCd+' ':'')+H.prjNm)+'<\/td><th>협력사/공종<\/th><td>'+h(j2(H.ptncoNm,H.wktpNm,' / '))+'<\/td>'+\n      '<th>'+KINDS[H.kind||'수시'].lbl+'<\/th><td>'+dot(H.sd)+' ~ '+dot(H.ed)+'<\/td><\/tr>'+\n      '<tr><th>작성자<\/th><td>'+h(H.writer)+(H.leader?' / 작업팀장 '+h(H.leader):'')+'<\/td><th>시공담당<\/th><td>'+h(H.sup)+'<\/td>'+\n      '<th>평가건수<\/th><td>총 '+list.length+'건 (고 '+c.고+' · 중 '+c.중+' · 저 '+c.저+')<\/td><\/tr><\/table>'+\n    '<table class=\"p-main\"><colgroup><col style=\"width:3%\"><col style=\"width:9%\"><col style=\"width:7%\"><col style=\"width:7.5%\"><col style=\"width:3.5%\"><col style=\"width:3.5%\">'+\n      '<col style=\"width:21.8%\"><col style=\"width:22.2%\"><col style=\"width:6.3%\"><col style=\"width:6.3%\"><col style=\"width:5.4%\"><col style=\"width:4.5%\"><\/colgroup>'+\n    '<thead><tr><th rowspan=\"2\">No.<\/th><th rowspan=\"2\">협력사명/공종<\/th><th colspan=\"2\">단위작업<\/th><th colspan=\"4\">작업내용<\/th><th colspan=\"2\">작업일자<\/th><th rowspan=\"2\">작성자/<br>작업팀장<\/th><th rowspan=\"2\">시공<br>담당<\/th><\/tr>'+\n    '<tr><th>대분류<\/th><th>소분류<\/th><th>위험도<\/th><th>구분<\/th><th>위험요인<\/th><th>대책방안<\/th><th>시작일<\/th><th>종료일<\/th><\/tr><\/thead>'+\n    '<tbody>'+body+'<\/tbody><\/table>';\n}\nfunction doPrint(){if(!rows.length){alert('표에 행이 없습니다.');return;}buildPrint();window.print();}\nwindow.addEventListener('beforeprint',buildPrint);\n\n/* ================= 저장 / 불러오기 ================= */\nconst DKEY='gsRiskDocs', CUR='gsRiskCurrent';\nfunction getDocs(){try{return JSON.parse(localStorage.getItem(DKEY))||[];}catch(e){return [];}}\nfunction setDocs(d){try{localStorage.setItem(DKEY,JSON.stringify(d));}catch(e){alert('저장 공간이 부족합니다. 오래된 저장본을 지워주세요.');}}\nfunction snapshot(){return {title:document.getElementById('docTitle').textContent,H:Object.assign({},H),rows:rows.map(r=>{const c=Object.assign({},r);delete c.id;return c;}),savedAt:new Date().toISOString()};}\nfunction loadSnap(s){\n  document.getElementById('docTitle').textContent=s.title||'위 험 성 평 가 표';\n  H=Object.assign(defH(),s.H||{});if(!KINDS[H.kind])H.kind='수시';\n  Object.keys(OLD_DEF).forEach(k=>{if(H[k]===OLD_DEF[k])H[k]='';});   // 예전 고정 기본값 제거\n  fillHeader();\n  rows=(s.rows||[]).map(r=>{const x=newRow(r);x.sub=cleanSub(x.sub);\n    [['ptnco','ptncoNm'],['wktp','wktpNm'],['pc','ptncoCd'],['wc','wktpCd'],['writer','writer'],['leader','leader'],['sup','sup']].forEach(([a,b])=>{if(x[a]===OLD_DEF[b])x[a]=H[b]||'';});\n    return x;});sel.clear();render();\n}\nlet _tt=null;function touch(){clearTimeout(_tt);_tt=setTimeout(()=>{try{localStorage.setItem(CUR,JSON.stringify(snapshot()));}catch(e){}},400);}\nfunction flushSave(){clearTimeout(_tt);try{localStorage.setItem(CUR,JSON.stringify(snapshot()));}catch(e){}}\nwindow.addEventListener('beforeunload',flushSave);window.addEventListener('pagehide',flushSave);\nfunction saveDoc(){\n  const s=snapshot();const nm=prompt('저장할 이름을 입력하세요.',(H.kind||'수시')+'_'+(H.prjNm||'위험성평가')+'_'+(H.ptncoNm||'')+'_'+dot(H.sd));\n  if(nm===null)return;s.name=nm.trim()||'무제';\n  const d=getDocs();const i=d.findIndex(x=>x.name===s.name);if(i>=0){if(!confirm('같은 이름이 있습니다. 덮어쓸까요?'))return;d[i]=s;}else d.push(s);\n  setDocs(d);toast('저장되었습니다 : '+s.name);\n}\nfunction openSaved(){\n  document.getElementById('libTitle').textContent='저장된 평가표';\n  const body=document.getElementById('libBody');const d=getDocs();\n  body.innerHTML='<div class=\"db-bar\"><button class=\"btn primary\" onclick=\"saveDocJSON()\">💾 지금 표를 JSON 파일로 저장<\/button>'+\n    '<button class=\"btn\" onclick=\"importXLSX()\">📥 JSON 파일 열기<\/button>'+\n    '<div class=\"lib-hint\" style=\"width:100%;padding:4px 2px 0;\">JSON 파일로 저장하면 다른 PC·브라우저에서도 그대로 열 수 있습니다.<\/div><\/div>';\n  if(!d.length)body.insertAdjacentHTML('beforeend','<div class=\"lib-hint\">브라우저에 저장된 문서가 없습니다.<\/div>');\n  else{d.slice().reverse().forEach(doc=>{\n    const it=document.createElement('div');it.className='saved-item';\n    const nm=document.createElement('div');nm.className='nm';\n    nm.innerHTML=h(doc.name)+'<small>'+(doc.rows||[]).length+'건 · '+new Date(doc.savedAt).toLocaleString('ko')+'<\/small>';\n    nm.onclick=()=>{if(rows.length&&!confirm('지금 표를 「'+doc.name+'」로 바꿀까요?'))return;loadSnap(doc);touch();closePanels();};\n    const del=document.createElement('button');del.className='rb del';del.textContent='✕';\n    del.onclick=()=>{if(!confirm('「'+doc.name+'」을(를) 삭제할까요?'))return;setDocs(getDocs().filter(x=>x.name!==doc.name));openSaved();};\n    it.append(nm,del);body.appendChild(it);});}\n  document.getElementById('lib').classList.add('open');document.getElementById('overlay').classList.add('show');\n}\nfunction saveDocJSON(){\n  const s=snapshot();const nm=(H.kind||'수시')+'위험성평가_'+(H.prjNm||'')+'_'+(H.ptncoNm||'')+'_'+fileStamp();\n  downloadBlob(new Blob([JSON.stringify(s,null,1)],{type:'application/json'}),nm.replace(/[\\\\/:*?\"<>|]/g,'')+'.json');\n}\nfunction exportLibJSON(){\n  downloadBlob(new Blob([JSON.stringify(getLib(),null,1)],{type:'application/json'}),'위험성평가_DB_'+fileStamp()+'.json');\n}\nfunction saveMyDefault(){\n  const o={};['prjCd','prjNm','bizDeptCd','ptncoNm','ptncoCd','wktpNm','wktpCd','writer','leader','sup','picId','cat'].forEach(k=>o[k]=H[k]||'');\n  try{localStorage.setItem(HKEY,JSON.stringify(o));}catch(e){}\n  toast('지금 기본정보를 내 기본값으로 저장했습니다');\n}\nfunction clearHeader(){\n  if(!confirm('기본정보(프로젝트·협력사·공종·작성자·작업팀장·시공담당·코드)를 모두 지울까요?\\n저장해 둔 내 기본값도 함께 지워집니다.'))return;\n  try{localStorage.removeItem(HKEY);}catch(e){}\n  const w=[H.sd,H.ed];H=Object.assign({},BLANK_H,{kind:H.kind||'수시',sd:w[0],ed:w[1]});fillHeader();\n  rows.forEach(r=>{r.ptnco='';r.wktp='';r.pc='';r.wc='';r.writer='';r.leader='';r.sup='';});render();touch();\n}\nfunction newDoc(){\n  if(!confirm('새 문서를 시작할까요? 저장하지 않은 내용은 사라집니다.\\n(기본정보·평가구분은 그대로 두고 날짜만 기본 기간으로 바뀝니다)'))return;\n  const w=kindRange(H.kind||'수시');H.sd=w[0];H.ed=w[1];fillHeader();rows=[];sel.clear();render();touch();\n}\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanels();closeAuto();}});\n\n/* ================= 시작 ================= */\n(function init(){\n  let s=null;try{s=JSON.parse(localStorage.getItem(CUR));}catch(e){}\n  bindHeader();\n  if(s&&s.rows)loadSnap(s);else{fillHeader();render();}\n})();\n<\/script>\n<\/body>\n<\/html>\n";</script>
